<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="description" content="Pog'ona — Ingliz tilini professional darajada o'rganing. A1-C2 daraja testi, grammatika, lug'at, tinglash va boshqalar.">
<title>Pog'ona — Ingliz tilini professional o'rganish platformasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e1a;--bg-2:#0f1422;--panel:rgba(255,255,255,.04);--panel-2:rgba(255,255,255,.06);
  --text:#f1f5f9;--text-2:#94a3b8;--muted:#64748b;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --primary:#8b5cf6;--primary-2:#6366f1;--primary-3:#3b82f6;
  --accent:#f59e0b;--success:#10b981;--danger:#ef4444;--pink:#ec4899;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#6366f1 50%,#3b82f6 100%);
  --grad-2:linear-gradient(135deg,#f59e0b 0%,#ef4444 100%);
  --grad-3:linear-gradient(135deg,#10b981 0%,#06b6d4 100%);
  --grad-4:linear-gradient(135deg,#ec4899 0%,#8b5cf6 100%);
  --radius:18px;--radius-lg:26px;
  --shadow:0 8px 32px rgba(0,0,0,.4);--shadow-lg:0 20px 60px rgba(0,0,0,.5);
  --glow:0 0 40px rgba(139,92,246,.3);
}
:root[data-theme="light"]{
  --bg:#f8fafc;--bg-2:#ffffff;--panel:#ffffff;--panel-2:#f1f5f9;
  --text:#0f172a;--text-2:#475569;--muted:#94a3b8;
  --line:rgba(15,23,42,.08);--line-2:rgba(15,23,42,.14);
  --shadow:0 8px 32px rgba(15,23,42,.1);--shadow-lg:0 20px 60px rgba(15,23,42,.15);
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  min-height:100vh;background:var(--bg);color:var(--text);
  font:16px/1.6 'Manrope',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;z-index:-1;
  background:
    radial-gradient(circle at 20% 20%,rgba(139,92,246,.15),transparent 50%),
    radial-gradient(circle at 80% 60%,rgba(59,130,246,.12),transparent 50%),
    radial-gradient(circle at 50% 90%,rgba(236,72,153,.08),transparent 50%);
  animation:floatBg 20s ease-in-out infinite;
}
@keyframes floatBg{0%,100%{transform:translate(0,0)}50%{transform:translate(-3%,3%)}}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Manrope',sans-serif;letter-spacing:-.03em;line-height:1.1;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:8px}
::selection{background:var(--primary);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--primary)}

/* ============ HEADER ============ */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(10,14,26,.7);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
:root[data-theme="light"] .header{background:rgba(248,250,252,.8)}
.header-inner{
  max-width:1280px;margin:0 auto;padding:14px 24px;
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.04em;cursor:pointer}
.brand-mark{
  width:40px;height:40px;border-radius:12px;
  background:var(--grad);color:#fff;display:grid;place-items:center;
  font:800 20px 'Bricolage Grotesque',sans-serif;
  box-shadow:0 8px 24px rgba(139,92,246,.4);
  position:relative;overflow:hidden;
}
.brand-mark::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(45deg,transparent,rgba(255,255,255,.3),transparent);
  transform:translateX(-100%);
  animation:shine 3s infinite;
}
@keyframes shine{100%{transform:translateX(100%)}}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{
  padding:10px 14px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);
  font-size:14px;font-weight:700;
  display:inline-flex;align-items:center;gap:6px;
  transition:all .2s;
}
.icon-btn:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 4px 16px rgba(139,92,246,.2)}

/* ============ NAV ============ */
.nav-wrap{max-width:1280px;margin:0 auto;padding:0 24px 12px;overflow-x:auto;scrollbar-width:none}
.nav-wrap::-webkit-scrollbar{display:none}
.nav{display:flex;gap:6px;padding-bottom:2px}
.nav button{
  white-space:nowrap;padding:9px 16px;border-radius:999px;
  font-weight:600;font-size:14px;color:var(--text-2);
  border:1px solid transparent;transition:all .2s;
  display:inline-flex;align-items:center;gap:6px;
}
.nav button:hover{background:var(--panel);color:var(--text)}
.nav button.on{background:var(--grad);color:#fff;box-shadow:0 4px 16px rgba(139,92,246,.3)}

/* ============ MAIN ============ */
.main{max-width:1280px;margin:0 auto;padding:32px 24px 80px;min-height:60vh}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 26px;border-radius:14px;
  font-weight:700;font-size:16px;
  transition:all .2s;white-space:nowrap;
  background:var(--panel);border:1px solid var(--line-2);
  position:relative;overflow:hidden;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.primary{background:var(--grad);color:#fff;border:0;box-shadow:0 8px 24px rgba(139,92,246,.4)}
.btn.primary:hover{box-shadow:0 12px 32px rgba(139,92,246,.5)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-2)}
.btn.good{background:var(--success);color:#fff;border:0}
.btn.danger{background:var(--danger);color:#fff;border:0}
.btn.sm{padding:10px 18px;font-size:14px;border-radius:12px}
.btn.lg{padding:18px 34px;font-size:18px;border-radius:18px}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(45deg,transparent,rgba(255,255,255,.2),transparent);
  transform:translateX(-100%);
}
.btn:hover::before{animation:shine .8s}

/* ============ HERO ============ */
.hero{
  display:grid;grid-template-columns:1.1fr .9fr;gap:56px;
  align-items:center;padding:20px 0 60px;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--text-2);
  margin-bottom:24px;backdrop-filter:blur(20px);
}
.hero-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 12px var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.hero h1{
  font-size:clamp(44px,7vw,88px);line-height:1;
  letter-spacing:-.05em;margin-bottom:24px;
}
.hero h1 em{
  font-style:normal;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  position:relative;
}
.hero p{color:var(--text-2);max-width:560px;font-size:18px;margin-bottom:32px;line-height:1.6}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:40px}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:600px}
.hero-stat{
  background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:16px;backdrop-filter:blur(20px);
  transition:all .2s;
}
.hero-stat:hover{transform:translateY(-4px);border-color:var(--primary);box-shadow:0 8px 24px rgba(139,92,246,.15)}
.hero-stat b{display:block;font:800 24px 'Bricolage Grotesque',sans-serif;margin-bottom:2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-stat span{font-size:12px;color:var(--muted);font-weight:600}

/* ============ STAIRS ============ */
.stairs{
  display:flex;align-items:flex-end;gap:10px;height:420px;
  padding:24px;border-radius:28px;
  background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(20px);
  position:relative;overflow:hidden;box-shadow:var(--shadow);
}
.stairs::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 70% 20%,rgba(139,92,246,.2),transparent 60%);
  pointer-events:none;
}
.step{
  flex:1;border-radius:16px 16px 6px 6px;padding:16px 12px;
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
  animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
  transition:all .3s;cursor:pointer;
  color:#fff;
}
.step:nth-child(1){background:linear-gradient(135deg,#10b981,#06b6d4)}
.step:nth-child(2){background:linear-gradient(135deg,#06b6d4,#3b82f6)}
.step:nth-child(3){background:linear-gradient(135deg,#3b82f6,#6366f1)}
.step:nth-child(4){background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.step:nth-child(5){background:linear-gradient(135deg,#8b5cf6,#d946ef)}
.step:nth-child(6){background:linear-gradient(135deg,#d946ef,#ec4899)}
.step:hover{transform:translateY(-8px);box-shadow:0 20px 40px rgba(139,92,246,.4)}
.step b{font:800 28px 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;margin-bottom:4px}
.step span{font-size:11px;opacity:.9;line-height:1.3;font-weight:600}
.step::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.2));
  pointer-events:none;
}
@keyframes rise{from{transform:translateY(100px);opacity:0}}

/* ============ SECTIONS ============ */
.section{margin-top:72px}
.section-head{
  display:flex;justify-content:space-between;align-items:end;
  margin-bottom:28px;gap:20px;flex-wrap:wrap;
}
.section-head h2{font-size:clamp(28px,4vw,44px);letter-spacing:-.04em}
.section-head p{color:var(--text-2);font-size:15px;max-width:560px}

/* ============ CARDS ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:26px;
  transition:all .3s;position:relative;overflow:hidden;
  backdrop-filter:blur(20px);
}
.card::before{
  content:'';position:absolute;inset:0;
  background:var(--grad);opacity:0;transition:opacity .3s;
  z-index:-1;
}
.card.hoverable{cursor:pointer}
.card.hoverable:hover{
  transform:translateY(-6px);
  border-color:transparent;
  box-shadow:0 20px 60px rgba(139,92,246,.3);
}
.card.hoverable:hover::before{opacity:.08}
.card-icon{
  width:56px;height:56px;border-radius:16px;
  display:grid;place-items:center;font-size:28px;
  margin-bottom:18px;
  background:var(--panel-2);border:1px solid var(--line);
  transition:all .3s;
}
.card.hoverable:hover .card-icon{transform:scale(1.1) rotate(-5deg);box-shadow:var(--glow)}
.card-icon.grad-1{background:var(--grad);color:#fff;border:0}
.card-icon.grad-2{background:var(--grad-2);color:#fff;border:0}
.card-icon.grad-3{background:var(--grad-3);color:#fff;border:0}
.card-icon.grad-4{background:var(--grad-4);color:#fff;border:0}
.card h3{font-size:22px;margin-bottom:8px}
.card p{color:var(--text-2);font-size:14px;line-height:1.6;margin-bottom:14px}
.card .tag{
  display:inline-block;padding:5px 12px;border-radius:999px;
  background:var(--panel-2);border:1px solid var(--line);
  font-size:12px;font-weight:700;color:var(--text-2);
}
.card .progress-mini{margin-top:14px;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.card .progress-mini i{display:block;height:100%;background:var(--grad);transition:width .6s}
.card .arrow{
  position:absolute;top:24px;right:24px;font-size:20px;
  opacity:0;transform:translateX(-10px);transition:all .3s;
}
.card.hoverable:hover .arrow{opacity:1;transform:translateX(0)}

/* ============ DAILY ============ */
.daily{
  background:var(--grad);color:#fff;
  border-radius:28px;padding:36px;
  display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;
  position:relative;overflow:hidden;
  box-shadow:0 20px 60px rgba(139,92,246,.4);
}
.daily::before{
  content:'';position:absolute;top:-50%;right:-20%;width:500px;height:500px;
  background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);
  pointer-events:none;
}
.daily::after{
  content:'';position:absolute;bottom:-30%;left:-10%;width:400px;height:400px;
  background:radial-gradient(circle,rgba(236,72,153,.3),transparent 70%);
  pointer-events:none;
}
.daily h2{font-size:clamp(24px,4vw,36px);margin-bottom:8px;color:#fff;position:relative;z-index:1}
.daily p{opacity:.95;font-size:16px;margin-bottom:20px;position:relative;z-index:1}
.daily-content{position:relative;z-index:1;text-align:left}
.daily-box{
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.2);
  padding:16px 20px;border-radius:16px;margin-bottom:12px;
}
.daily-box-label{font-size:11px;opacity:.85;margin-bottom:6px;font-weight:700;letter-spacing:.08em}
.daily-box-word{font-weight:800;font-size:20px;margin-bottom:4px;font-family:'Bricolage Grotesque',sans-serif}
.daily-box-trans{font-size:14px;opacity:.9}

/* ============ QUIZ ============ */
.quiz{max-width:820px;margin:0 auto}
.quiz-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;gap:12px;flex-wrap:wrap;
}
.quiz-title{font-weight:700;font-size:15px;color:var(--text-2)}
.quiz-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);
  font-size:13px;font-weight:700;backdrop-filter:blur(20px);
}
.chip.good{background:rgba(16,185,129,.15);color:var(--success);border-color:rgba(16,185,129,.3)}
.chip.warn{background:rgba(245,158,11,.15);color:var(--accent);border-color:rgba(245,158,11,.3)}
.chip.danger{background:rgba(239,68,68,.15);color:var(--danger);border-color:rgba(239,68,68,.3);animation:pulse 1s infinite}
.chip.timer{font-variant-numeric:tabular-nums}

.progress{height:8px;background:var(--panel);border-radius:999px;overflow:hidden;margin-bottom:32px;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--grad);transition:width .5s ease;box-shadow:0 0 20px rgba(139,92,246,.5)}

.passage{
  background:var(--panel);border:1px solid var(--line);
  border-left:4px solid var(--primary);
  border-radius:16px;padding:22px 24px;margin-bottom:24px;
  font-size:17px;line-height:1.7;backdrop-filter:blur(20px);
}
.passage b{display:block;margin-bottom:10px;font-size:13px;color:var(--primary);text-transform:uppercase;letter-spacing:.08em;font-weight:800}

.q-text{
  font:700 clamp(24px,3.5vw,34px)/1.25 'Bricolage Grotesque',sans-serif;
  letter-spacing:-.02em;margin-bottom:28px;
}

.opts{display:grid;gap:12px}
.opt{
  display:flex;gap:16px;align-items:center;
  text-align:left;width:100%;padding:18px 22px;
  border:1.5px solid var(--line-2);
  background:var(--panel);border-radius:16px;
  font-size:17px;font-weight:600;
  transition:all .2s;backdrop-filter:blur(20px);
  position:relative;overflow:hidden;
}
.opt:hover:not(:disabled){
  border-color:var(--primary);transform:translateX(6px);
  background:var(--panel-2);box-shadow:0 8px 24px rgba(139,92,246,.15);
}
.opt kbd{
  font:700 14px 'Manrope',sans-serif;
  min-width:30px;height:30px;padding:0 10px;
  display:grid;place-items:center;
  border:1px solid var(--line-2);border-radius:10px;
  color:var(--text-2);flex-shrink:0;background:var(--panel-2);
}
.opt.sel{background:var(--grad);color:#fff;border-color:transparent}
.opt.sel kbd{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.opt.good{background:var(--grad-3);color:#fff;border-color:transparent}
.opt.good kbd{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.opt.badc{background:var(--grad-2);color:#fff;border-color:transparent}
.opt.badc kbd{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.opt:disabled{cursor:default;transform:none}

.expl{
  margin-top:24px;padding:18px 22px;
  background:var(--panel);border:1px solid var(--line);
  border-left:4px solid var(--primary);
  border-radius:16px;font-size:15px;line-height:1.6;
  animation:slideDown .35s cubic-bezier(.2,.8,.2,1);
  backdrop-filter:blur(20px);
}
.expl b{color:var(--primary)}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px)}}

.quiz-nav{display:flex;justify-content:space-between;gap:12px;margin-top:32px;flex-wrap:wrap}

/* ============ FLASHCARD ============ */
.flashcard{
  width:100%;min-height:360px;
  border:1px solid var(--line-2);border-radius:28px;
  background:var(--panel);padding:32px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;text-align:center;cursor:pointer;transition:all .3s;
  position:relative;overflow:hidden;backdrop-filter:blur(20px);
  font:800 clamp(36px,7vw,64px)/1.15 'Bricolage Grotesque',sans-serif;
  letter-spacing:-.03em;
  box-shadow:var(--shadow);
}
.flashcard:hover{border-color:var(--primary);transform:translateY(-4px);box-shadow:var(--shadow-lg),var(--glow)}
.flashcard small{font:500 15px 'Manrope',sans-serif;color:var(--text-2);letter-spacing:0}

/* ============ RESULT ============ */
.result{padding:20px 0}
.result-hero{text-align:center;padding:40px 0}
.result-level{
  font:800 clamp(110px,20vw,200px)/.85 'Bricolage Grotesque',sans-serif;
  letter-spacing:-.07em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  display:inline-block;
  animation:zoomIn .8s cubic-bezier(.2,.8,.2,1);
  filter:drop-shadow(0 20px 40px rgba(139,92,246,.4));
}
@keyframes zoomIn{from{transform:scale(.3) rotate(-10deg);opacity:0}}
.result-title{font-size:clamp(24px,4vw,38px);margin-top:20px}
.result-desc{color:var(--text-2);max-width:640px;margin:16px auto 0;font-size:17px;line-height:1.6}

.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:48px}
.result-col h3{font-size:24px;margin-bottom:18px;display:flex;align-items:center;gap:10px}

.level-rows{display:grid;gap:10px}
.level-row{
  display:grid;grid-template-columns:52px 1fr 60px;gap:14px;align-items:center;
  padding:12px 18px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;font-weight:700;backdrop-filter:blur(20px);
  transition:all .2s;
}
.level-row:hover{transform:translateX(4px);border-color:var(--line-2)}
.level-row.pass{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08)}
.level-row .bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.level-row .bar i{display:block;height:100%;background:var(--grad);transition:width .8s;border-radius:999px}
.level-row.pass .bar i{background:var(--grad-3)}
.level-row span:last-child{text-align:right;color:var(--text-2);font-weight:600;font-size:14px}

.wrong-list{display:grid;gap:10px}
.wrong-item{
  background:var(--panel);border:1px solid var(--line);
  border-left:4px solid var(--danger);
  border-radius:14px;padding:16px 20px;font-size:14px;line-height:1.6;
  backdrop-filter:blur(20px);
}
.wrong-item small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.wrong-item .correct{color:var(--success);font-weight:700}
.wrong-item .yours{color:var(--danger);font-weight:700}

/* ============ STATS ============ */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.stat-box{
  background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:24px;text-align:center;transition:all .3s;
  backdrop-filter:blur(20px);position:relative;overflow:hidden;
}
.stat-box::before{
  content:'';position:absolute;inset:0;
  background:var(--grad);opacity:0;transition:opacity .3s;
}
.stat-box:hover{border-color:var(--primary);transform:translateY(-4px);box-shadow:0 12px 32px rgba(139,92,246,.2)}
.stat-box:hover::before{opacity:.05}
.stat-box b{display:block;font:800 36px 'Bricolage Grotesque',sans-serif;margin-bottom:6px;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;position:relative;z-index:1}
.stat-box span{font-size:13px;color:var(--text-2);font-weight:700;position:relative;z-index:1}

.hist{display:flex;gap:10px;flex-wrap:wrap}
.hist-item{
  background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;
  display:inline-flex;gap:8px;align-items:center;
  backdrop-filter:blur(20px);transition:all .2s;
}
.hist-item:hover{border-color:var(--primary);transform:translateY(-2px)}
.hist-item b{color:var(--primary);font-weight:800}

/* ============ ACHIEVEMENTS ============ */
.achievements{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.achv{
  background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:22px;text-align:center;
  transition:all .3s;position:relative;backdrop-filter:blur(20px);
}
.achv.locked{opacity:.35;filter:grayscale(1)}
.achv.unlocked{
  border-color:transparent;
  background:linear-gradient(180deg,rgba(139,92,246,.15),var(--panel));
  box-shadow:0 8px 24px rgba(139,92,246,.15);
}
.achv.unlocked:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 16px 40px rgba(139,92,246,.3)}
.achv.unlocked::after{
  content:'✓';position:absolute;top:12px;right:12px;
  width:26px;height:26px;border-radius:50%;
  background:var(--grad-3);color:#fff;
  display:grid;place-items:center;font-size:14px;font-weight:800;
  box-shadow:0 4px 12px rgba(16,185,129,.4);
}
.achv-emoji{font-size:48px;margin-bottom:12px;display:block;line-height:1}
.achv b{display:block;font-size:16px;margin-bottom:6px}
.achv small{color:var(--text-2);font-size:12px;line-height:1.4;display:block}

/* ============ TIPS ============ */
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tip{
  background:var(--panel);border:1px solid
  /* ============ TIPS (davomi) ============ */
.tip{
  background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:22px;display:flex;gap:16px;
  transition:all .3s;backdrop-filter:blur(20px);
}
.tip:hover{transform:translateY(-4px);border-color:var(--primary);box-shadow:0 12px 32px rgba(139,92,246,.15)}
.tip-icon{font-size:32px;line-height:1;flex-shrink:0}
.tip h4{font-size:17px;margin-bottom:6px}
.tip p{font-size:14px;color:var(--text-2);line-height:1.6}

/* ============ FOOTER ============ */
.footer{
  border-top:1px solid var(--line);
  padding:48px 24px calc(48px + env(safe-area-inset-bottom,0px));
  margin-top:80px;
}
.footer-inner{
  max-width:1280px;margin:0 auto;
  display:grid;grid-template-columns:1fr auto 1fr;gap:32px;align-items:center;
}
.footer-brand{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.04em;margin-bottom:6px}
.footer p{color:var(--muted);font-size:13px}
.footer-links{display:flex;gap:20px;justify-content:center}
.footer-links a{
  font-size:14px;font-weight:700;color:var(--text-2);
  transition:all .2s;padding:8px 14px;border-radius:10px;
  display:inline-flex;align-items:center;gap:6px;
}
.footer-links a:hover{color:var(--primary);background:var(--panel)}
.footer-copy{text-align:right;color:var(--muted);font-size:12px}

/* ============ TOAST ============ */
.toast{
  position:fixed;bottom:30px;left:50%;transform:translate(-50%,150%);
  background:var(--text);color:var(--bg);
  padding:16px 26px;border-radius:16px;
  font-weight:700;font-size:15px;
  box-shadow:var(--shadow-lg);
  transition:transform .4s cubic-bezier(.2,.8,.2,1);
  z-index:1000;pointer-events:none;
  max-width:90vw;text-align:center;
  backdrop-filter:blur(20px);
}
.toast.on{transform:translate(-50%,0)}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--danger);color:#fff}

/* ============ MODAL ============ */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:none;align-items:center;justify-content:center;
  z-index:500;padding:20px;
}
.modal.on{display:flex;animation:fadeIn .3s}
.modal-inner{
  background:var(--bg-2);border:1px solid var(--line);
  border-radius:28px;padding:40px;
  max-width:520px;width:100%;
  box-shadow:var(--shadow-lg);
  animation:modalIn .4s cubic-bezier(.2,.8,.2,1);
  text-align:center;position:relative;overflow:hidden;
}
.modal-inner::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle,rgba(139,92,246,.2),transparent 70%);
  pointer-events:none;
}
.modal-inner > *{position:relative;z-index:1}
@keyframes fadeIn{from{opacity:0}}
@keyframes modalIn{from{opacity:0;transform:scale(.9) translateY(30px)}}
.modal-emoji{font-size:80px;margin-bottom:20px;display:block;animation:bounce .8s}
@keyframes bounce{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}

/* ============ CONFETTI ============ */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:1000;overflow:hidden}
.confetti i{position:absolute;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ============ CALENDAR ============ */
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:20px}
.cal-day{
  aspect-ratio:1;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:700;
  color:var(--text-2);transition:all .2s;
}
.cal-day.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(139,92,246,.3)}
.cal-day.today{outline:2px solid var(--accent);outline-offset:2px}

/* ============ CERTIFICATE ============ */
.certificate{
  background:var(--panel);border:2px solid var(--primary);
  border-radius:24px;padding:48px;text-align:center;
  position:relative;overflow:hidden;max-width:720px;margin:20px auto;
}
.certificate::before{
  content:'';position:absolute;inset:12px;
  border:1px solid var(--line-2);border-radius:18px;pointer-events:none;
}
.certificate h2{font-size:32px;margin-bottom:8px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.certificate .cert-level{font:800 96px 'Bricolage Grotesque',sans-serif;letter-spacing:-.05em;margin:20px 0;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.certificate .cert-name{font-size:20px;font-weight:700;margin:24px 0 8px;border-bottom:2px dashed var(--line-2);padding-bottom:8px;display:inline-block;min-width:280px}
.certificate .cert-date{color:var(--text-2);font-size:14px;margin-top:16px}

/* ============ RESPONSIVE ============ */
@media(max-width:900px){
  .hero{grid-template-columns:1fr;gap:40px;padding:0 0 40px}
  .stairs{height:300px}
  .hero-stats{grid-template-columns:repeat(2,1fr)}
  .result-grid{grid-template-columns:1fr}
  .footer-inner{grid-template-columns:1fr;text-align:center;gap:20px}
  .footer-copy{text-align:center}
  .daily{grid-template-columns:1fr;text-align:center;padding:28px}
  .daily-content{text-align:center}
}
@media(max-width:600px){
  .main,.header-inner,.nav-wrap,.footer{padding-left:16px;padding-right:16px}
  .hero h1{font-size:40px}
  .opt{padding:14px 16px;font-size:15px}
  .q-text{font-size:20px}
  .btn{padding:12px 20px;font-size:15px}
  .card{padding:20px}
  .modal-inner{padding:28px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .certificate{padding:28px}
  .certificate .cert-level{font-size:64px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

function $(s){ return document.querySelector(s); }
function $$(s){ return document.querySelectorAll(s); }
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function shuffle(a){
  a = a.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function today(){ return new Date().toDateString(); }

function toast(msg, type){
  toastEl.textContent = msg;
  toastEl.className = "toast on" + (type ? " " + type : "");
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(function(){ toastEl.classList.remove("on"); }, 2400);
}

function openModal(html){
  modalInner.innerHTML = html;
  modalEl.classList.add("on");
}
function closeModal(){ modalEl.classList.remove("on"); }
modalEl.onclick = function(e){ if(e.target === modalEl) closeModal(); };

function speak(text){
  if(!("speechSynthesis" in window)){ toast("Ovoz qo'llab-quvvatlanmaydi"); return; }
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

function confetti(count){
  count = count || 50;
  var colors = ["#8b5cf6","#6366f1","#3b82f6","#ec4899","#f59e0b","#10b981"];
  confettiEl.innerHTML = "";
  for(var i = 0; i < count; i++){
    var el = document.createElement("i");
    el.style.left = Math.random() * 100 + "%";
    el.style.top = "-20px";
    el.style.width = (6 + Math.random() * 10) + "px";
    el.style.height = (6 + Math.random() * 10) + "px";
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDelay = (Math.random() * 0.6) + "s";
    el.style.animationDuration = (2 + Math.random() * 2) + "s";
    el.style.borderRadius = Math.random() > 0.5 ? "50%" : "3px";
    confettiEl.appendChild(el);
  }
  setTimeout(function(){ confettiEl.innerHTML = ""; }, 5000);
}

/* ============ STORAGE ============ */
var store = {
  KEY: "pogona_v3",
  get: function(){
    try{
      var raw = localStorage.getItem(this.KEY);
      return raw ? JSON.parse(raw) : this.def();
    }catch(e){ return this.def(); }
  },
  save: function(d){
    try{ localStorage.setItem(this.KEY, JSON.stringify(d)); }catch(e){}
  },
  def: function(){
    return {
      history: [], wrong: [],
      streak: { days:0, last:"", best:0, calendar:[] },
      achievements: [], cards: {}, writing: {},
      visited: [], dailyBonus: ""
    };
  },
  add: function(r){
    var d = this.get();
    d.history.unshift(r);
    d.history = d.history.slice(0, 50);
    this.save(d);
  },
  addWrong: function(item){
    var d = this.get();
    var exists = d.wrong.some(function(w){ return w.t === item.t; });
    if(!exists){
      d.wrong.unshift({ t:item.t, correct:item.correct, chosen:item.chosen, date: todayISO() });
      d.wrong = d.wrong.slice(0, 100);
      this.save(d);
    }
  },
  clearWrong: function(){ var d = this.get(); d.wrong = []; this.save(d); },
  clearAll: function(){ try{ localStorage.removeItem(this.KEY); }catch(e){} },
  updateStreak: function(){
    var d = this.get();
    var t = today();
    if(d.streak.last === t) return d.streak;
    var y = new Date(Date.now() - 86400000).toDateString();
    d.streak.days = (d.streak.last === y) ? d.streak.days + 1 : 1;
    d.streak.last = t;
    if(d.streak.days > d.streak.best) d.streak.best = d.streak.days;
    /* Kalendarga qo'shish */
    var iso = todayISO();
    if(d.streak.calendar.indexOf(iso) === -1) d.streak.calendar.push(iso);
    if(d.streak.calendar.length > 60) d.streak.calendar = d.streak.calendar.slice(-60);
    this.save(d);
    return d.streak;
  },
  saveCard: function(word){
    var d = this.get();
    d.cards[word] = (d.cards[word] || 0) + 1;
    this.save(d);
  },
  saveWriting: function(title, text){
    var d = this.get();
    d.writing[title] = text;
    this.save(d);
  },
  addVisited: function(m){
    var d = this.get();
    if(d.visited.indexOf(m) === -1){ d.visited.push(m); this.save(d); }
  },
  canClaimBonus: function(){
    var d = this.get();
    return d.dailyBonus !== todayISO();
  },
  claimBonus: function(){
    var d = this.get();
    d.dailyBonus = todayISO();
    this.save(d);
  }
};

var achv = {
  unlock: function(id){
    var d = store.get();
    if(d.achievements.indexOf(id) !== -1) return false;
    d.achievements.push(id);
    store.save(d);
    var a = ACHIEVEMENTS.filter(function(x){ return x.id === id; })[0];
    if(a){
      setTimeout(function(){
        openModal(
          '<span class="modal-emoji">' + a.emoji + '</span>' +
          '<h2 style="font-size:28px;margin-bottom:10px">🎉 Yangi yutuq!</h2>' +
          '<p style="background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;font-size:20px;margin-bottom:10px">' + esc(a.title) + '</p>' +
          '<p style="color:var(--text-2);margin-bottom:28px;font-size:15px">' + esc(a.desc) + '</p>' +
          '<button class="btn primary" onclick="window.closeModal()">Davom etish →</button>'
        );
        confetti(40);
      }, 400);
    }
    return true;
  },
  check: function(){
    var d = store.get();
    var self = this;
    if(d.history.length >= 1) self.unlock("first");
    if(d.streak.days >= 3) self.unlock("streak3");
    if(d.streak.days >= 7) self.unlock("streak7");
    if(d.history.some(function(h){ return h.p === 100; })) self.unlock("perfect");
    if(d.history.some(function(h){ return h.l === "B2" || h.l === "C1" || h.l === "C2"; })) self.unlock("b2");
    if(d.history.some(function(h){ return h.l === "C1" || h.l === "C2"; })) self.unlock("c1");
    if(d.visited.indexOf("grammar") !== -1) self.unlock("grammar");
    if(d.visited.indexOf("read") !== -1) self.unlock("reader");
    if(d.visited.indexOf("listen") !== -1) self.unlock("listener");
    if(d.visited.indexOf("write") !== -1) self.unlock("writer");
    var known = Object.keys(d.cards).filter(function(k){ return d.cards[k] > 0; }).length;
    if(known >= 60) self.unlock("vocab100");
    var needed = ["level","grammar","vocab","read","listen","phrase","kids","biz","write","cards"];
    if(needed.every(function(m){ return d.visited.indexOf(m) !== -1; })) self.unlock("allround");
  },
  has: function(id){ return store.get().achievements.indexOf(id) !== -1; }
};

  /* ============ PRACTICE ENGINE ============ */
function getPracticeData(k){
  if(k === "grammar") return { t:"Grammatika", q: shuffle(GRAMMAR).slice(0, 10) };
  if(k === "vocab"){
    var picked = shuffle(VOCAB).slice(0, 10);
    return {
      t: "Lug'at",
      q: picked.map(function(p){
        var w = p[0], correct = p[1];
        var others = shuffle(VOCAB.filter(function(x){ return x[0] !== w; }).map(function(x){ return x[1]; })).slice(0, 3);
        return ['"' + w + '" nima degani?', [correct].concat(others), 0];
      })
    };
  }
  if(k === "kids") return { t:"Bolalar", q: shuffle(KIDS).slice(0, 10) };
  if(k === "biz") return { t:"Biznes", q: shuffle(BUSINESS).slice(0, 10) };
  if(k === "phrase") return { t:"Frazal fe'llar", q: shuffle(PHRASAL).slice(0, 10) };
  return null;
}

function startPractice(k){
  if(k === "read"){ startReading(); return; }
  var d = getPracticeData(k);
  if(!d){ home(); return; }
  P = {
    k: k, i: 0, s: 0, a: null, done: false,
    d: { t: d.t },
    q: d.q.map(function(r){
      return {
        t: r[0], e: r[3],
        o: shuffle(r[1].map(function(x, j){ return { x:x, c: j === r[2] }; }))
      };
    })
  };
  renderPractice();
}

function startReading(){
  var r = READINGS[Math.floor(Math.random() * READINGS.length)];
  P = {
    k: "read", i: 0, s: 0, a: null, done: false,
    d: { t: "O'qish", p: r.text, title: r.title },
    q: r.q.map(function(x){
      return { t: x[0], o: shuffle(x[1].map(function(v, j){ return { x:v, c: j === x[2] }; })) };
    })
  };
  renderPractice();
}

function renderPractice(){
  var d = P.d, q = P.q[P.i], n = P.q.length, a = P.a;
  var html = '<section class="quiz">';
  html += '<div class="quiz-head">';
  html += '  <span class="quiz-title">' + esc(d.t) + '</span>';
  html += '  <div class="quiz-meta">';
  html += '    <span class="chip">' + (P.i + 1) + '/' + n + '</span>';
  html += '    <span class="chip good">✓ ' + P.s + '</span>';
  html += '  </div>';
  html += '</div>';
  html += '<div class="progress"><i style="width:' + (P.i / n * 100) + '%"></i></div>';

  if(d.p){
    html += '<p class="passage"><b>' + esc(d.title || "") + '</b>';
    html += esc(d.p);
    html += ' <button class="icon-btn" style="padding:4px 10px;font-size:14px" onclick="window.speakText(\'' + esc(d.p).replace(/'/g, "\\'") + '\')">🔊</button>';
    html += '</p>';
  }

  html += '<h2 class="q-text">' + esc(q.t) + '</h2>';
  html += '<div class="opts">';
  q.o.forEach(function(o, j){
    var cls = "opt";
    if(a !== null){
      if(o.c) cls += " good";
      else if(j === a) cls += " badc";
    }
    html += '<button class="' + cls + '" data-k="' + j + '"' + (a !== null ? " disabled" : "") + '>';
    html += '<kbd>' + (j + 1) + '</kbd>' + esc(o.x);
    html += '</button>';
  });
  html += '</div>';

  if(a !== null){
    var ok = q.o[a].c;
    html += '<p class="expl"><b>' + (ok ? "✅ To'g'ri!" : "❌ Noto'g'ri.") + '</b> ';
    html += esc(q.e || (ok ? "Barakalla!" : "To'g'ri javob: " + q.o.filter(function(o){ return o.c; })[0].x));
    html += '</p>';
    html += '<div class="quiz-nav"><span></span>';
    html += '<button class="btn primary" onclick="window.practiceNext()">' + (P.i === n - 1 ? "Yakunlash →" : "Keyingi →") + '</button>';
    html += '</div>';
  }

  html += '</section>';
  app.innerHTML = html;

  $$(".opt").forEach(function(b){
    b.onclick = function(){ practiceAnswer(parseInt(b.dataset.k)); };
  });
}

function practiceAnswer(j){
  if(P.a !== null) return;
  P.a = j;
  var q = P.q[P.i];
  if(q.o[j].c) P.s++;
  else store.addWrong({ t:q.t, correct:q.o.filter(function(o){ return o.c; })[0].x, chosen:q.o[j].x });
  renderPractice();
}

function practiceNext(){
  if(P.a === null) return;
  if(P.i < P.q.length - 1){
    P.i++; P.a = null; renderPractice();
  } else {
    finishPractice();
  }
}

function finishPractice(){
  P.done = true;
  var n = P.q.length, p = Math.round(P.s / n * 100);
  store.add({ l: P.d.t, p: p, date: new Date().toLocaleDateString("uz-UZ"), mode: P.k });
  store.updateStreak();
  updateStreakDisplay();
  achv.check();

  var msg = p >= 80 ? "🎉 Ajoyib natija!" : p >= 50 ? "👍 Yaxshi, davom eting!" : "💪 Yana bir bor urinib ko'ring.";
  var html = '<section class="result">';

  html += '  <p style="color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px">' + esc(P.d.t) + '</p>';

  html += '  <p class="result-desc">Natija: ' + p + '%</p>';
  html += '</div>';
  html += '<div class="quiz-nav" style="justify-content:center">';
  html += '  <button class="btn primary" onclick="window.practiceAgain()">🔄 Qayta urinish</button>';
  html += '  <button class="btn" onclick="go(\'home\')">🏠 Bosh sahifa</button>';
  html += '  <button class="btn" onclick="go(\'stats\')">📊 Statistika</button>';
  html += '</div>';
  html += '</section>';
  app.innerHTML = html;

  if(p >= 80) confetti(60);

}

/* ============ STATS ============ */
function renderStats(){
  var d = store.get();
  var totalAttempts = d.history.length;
  var avg = 0, best = 0;
  if(totalAttempts){
    var sum = 0;
    d.history.forEach(function(h){
      sum += h.p;
      if(h.p > best) best = h.p;
    });
    avg = Math.round(sum / totalAttempts);
  }

  var html = '<section class="section">';
  html += '<div class="section-head"><h2>📊 Statistika</h2>';
  html += '<p>Sizning umumiy natijalaringiz va o\'sishingiz.</p></div>';

  html += '<div class="stat-grid">';
  html += '  <div class="stat-box"><b>' + totalAttempts + '</b><span>URINISHLAR</span></div>';
  html += '  <div class="stat-box"><b>' + avg + '%</b><span>O\'RTACHA</span></div>';
  html += '  <div class="stat-box"><b>' + best + '%</b><span>ENG YAXSHI</span></div>';
  html += '  <div class="stat-box"><b>' + d.streak.days + '🔥</b><span>SERIYA</span></div>';
  html += '  <div class="stat-box"><b>' + d.streak.best + '⭐</b><span>REKORD</span></div>';
  html += '  <div class="stat-box"><b>' + d.wrong.length + '</b><span>XATOLAR</span></div>';
  html += '</div>';

  /* Calendar */
  html += '<div class="section-head" style="margin-top:48px"><h2 style="font-size:26px">📅 Faollik kalendari</h2>';
  html += '<p>Oxirgi 30 kunlik mashqlaringiz.</p></div>';
  html += '<div class="calendar">';
  var cal = d.streak.calendar || [];
  for(var i = 29; i >= 0; i--){
    var dt = new Date(Date.now() - i * 86400000);
    var iso = dt.toISOString().slice(0,10);
    var active = cal.indexOf(iso) !== -1;
    var isToday = iso === todayISO();
    html += '<div class="cal-day' + (active ? " active" : "") + (isToday ? " today" : "") + '" title="' + iso + '">' + dt.getDate() + '</div>';
  }
  html += '</div>';

  /* History */
  html += '<div class="section-head" style="margin-top:48px"><h2 style="font-size:26px">Oxirgi natijalar</h2></div>';
  if(d.history.length){
    html += '<div class="hist">';
    d.history.slice(0, 20).forEach(function(h){
      html += '<div class="hist-item"><b>' + esc(h.l) + '</b> · ' + h.p + '% · ' + esc(h.date) + '</div>';
    });
    html += '</div>';
  } else {
    html += '<p style="color:var(--text-2)">Hali natijalar yo\'q. Testdan boshlang!</p>';
  }

  /* Wrong answers */
  html += '<div class="section-head" style="margin-top:48px"><h2 style="font-size:26px">❌ Xatolar (' + d.wrong.length + ')</h2></div>';
  if(d.wrong.length){
    html += '<div class="wrong-list">';
    d.wrong.slice(0, 30).forEach(function(w){
      html += '<div class="wrong-item">';
      html += '  <small>SAVOL</small>';
      html += '  <div style="margin-bottom:8px;font-weight:600">' + esc(w.t) + '</div>';
      html += '  <div style="font-size:14px">Sizning javob: <span class="yours">' + esc(w.chosen) + '</span></div>';
      html += '  <div style="font-size:14px">To\'g\'ri javob: <span class="correct">' + esc(w.correct) + '</span></div>';
      html += '</div>';
    });
    html += '</div>';
  } else {
    html += '<div class="wrong-item" style="border-left-color:var(--success)">🎉 Xatolar yo\'q! Ajoyib!</div>';
  }

  /* Actions */
  html += '<div class="quiz-nav" style="margin-top:32px">';
  html += '  <button class="btn" onclick="window.clearWrongs()">🗑 Xatolarni tozalash</button>';
  html += '  <button class="btn danger" onclick="window.clearEverything()">⚠️ Hammasini o\'chirish</button>';
  html += '</div>';

  html += '</section>';
  app.innerHTML = html;
}

  /* ============ LEVEL TEST ============ */
function startLevelTest(){
  var q = [];
  for(var lv = 0; lv < 6; lv++){
    var bucket = [];
    for(var i = lv * 8; i < lv * 8 + 8 && i < RAW.length; i++){
      bucket.push(RAW[i]);
    }
    var picked = shuffle(bucket).slice(0, 5);
    picked.forEach(function(r){
      q.push({
        lv: lv,
        t: r[0],
        o: shuffle(r[1].map(function(x, k){ return { x:x, c: k === r[2] }; }))
      });
    });
  }
  S = { i: 0, a: [], t: Date.now(), q: q, done: false };
  renderQuiz();
  startTimer();
}

function startTimer(){
  stopTimer();
  var start = Date.now();
  timerInterval = setInterval(function(){
    var el = $("#tmr");
    if(!el) return;
    var sec = Math.floor((Date.now() - start) / 1000);
    var m = ("0" + Math.floor(sec / 60)).slice(-2);
    var s = ("0" + (sec % 60)).slice(-2);
    el.textContent = "⏱ " + m + ":" + s;
    el.className = "chip timer" + (sec > 480 ? " danger" : sec > 300 ? " warn" : "");
  }, 1000);
}

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}

function renderQuiz(){
  var q = S.q[S.i], n = S.q.length, sel = S.a[S.i];
  var html = '<section class="quiz">';
  html += '<div class="quiz-head">';
  html += '  <span class="quiz-title">🎯 Daraja testi</span>';
  html += '  <div class="quiz-meta">';
  html += '    <span class="chip">Savol ' + (S.i + 1) + '/' + n + '</span>';
  html += '    <span class="chip timer" id="tmr">⏱ 00:00</span>';
  html += '  </div>';
  html += '</div>';
  html += '<div class="progress"><i style="width:' + (S.i / n * 100) + '%"></i></div>';
  html += '<h2 class="q-text">' + esc(q.t) + '</h2>';
  html += '<div class="opts">';
  q.o.forEach(function(o, k){
    html += '<button class="opt' + (sel === k ? " sel" : "") + '" data-k="' + k + '">';
    html += '<kbd>' + (k + 1) + '</kbd>' + esc(o.x);
    html += '</button>';
  });
  html += '</div>';
  html += '<div class="quiz-nav">';
  html += '  <button class="btn" onclick="window.quizBack()"' + (S.i === 0 ? " disabled" : "") + '>← Orqaga</button>';
  html += '  <button class="btn primary" onclick="window.quizNext()"' + (sel === undefined ? " disabled" : "") + '>';
  html += (S.i === n - 1 ? "Natijani ko'rish →" : "Keyingi →");
  html += '  </button>';
  html += '</div>';
  html += '</section>';
  app.innerHTML = html;

  $$(".opt").forEach(function(b){
    b.onclick = function(){ quizPick(parseInt(b.dataset.k)); };
  });
}

function quizPick(k){
  S.a[S.i] = k;
  renderQuiz();
}

window.quizBack = function(){
  if(S.i > 0){ S.i--; renderQuiz(); }
};

window.quizNext = function(){
  if(S.a[S.i] === undefined) return;
  if(S.i < S.q.length - 1){
    S.i++; renderQuiz();
  } else {
    renderResult();
  }
};

/* ============ RESULT ============ */
function renderResult(){
  stopTimer();
  S.done = true;

  var sc = [0,0,0,0,0,0];
  S.q.forEach(function(q, i){
    if(q.o[S.a[i]] && q.o[S.a[i]].c) sc[q.lv]++;
  });

  var idx = -1;
  for(var l = 0; l < 6; l++){
    if(sc[l] >= 3) idx = l;
    else break;
  }

  var lv = idx < 0 ? "Pre-A1" : LEVELS[idx];
  var total = sc.reduce(function(a,b){ return a+b; }, 0);
  var pct = Math.round(total / 30 * 100);
  var mins = Math.max(1, Math.round((Date.now() - S.t) / 60000));

  store.add({ l: lv, p: pct, date: new Date().toLocaleDateString("uz-UZ"), mode: "level" });
  store.updateStreak();
  updateStreakDisplay();

  var wrong = [];
  S.q.forEach(function(q, i){
    if(!(q.o[S.a[i]] && q.o[S.a[i]].c)){
      wrong.push({ q: q, i: i });
      var chosen = S.a[i] !== undefined ? q.o[S.a[i]].x : "—";
      store.addWrong({
        t: q.t,
        correct: q.o.filter(function(o){ return o.c; })[0].x,
        chosen: chosen
      });
    }
  });

  achv.check();

  var info = LEVEL_INFO[lv];

  var html = '<section class="result">';
  html += '<div class="result-hero">';
  html += '  <p style="color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px">Sizning darajangiz</p>';
  html += '  <div class="result-level">' + lv + '</div>';
  html += '  <h2 class="result-title">' + info.emoji + ' ' + esc(info.name) + '</h2>';
  html += '  <p class="result-desc">' + esc(info.desc) + '</p>';
  html += '</div>';

  /* Actions */
  html += '<div class="quiz-nav" style="justify-content:center;margin-bottom:40px">';
  html += '  <button class="btn primary" onclick="window.retakeTest()">🔄 Qayta topshirish</button>';
  html += '  <button class="btn" onclick="window.showCert(\'' + lv + '\',' + total + ',' + pct + ')">🎓 Sertifikat</button>';
  html += '  <button class="btn" onclick="window.copyResult(\'' + lv + '\',' + total + ',' + pct + ')">📋 Nusxalash</button>';
  html += '  <button class="btn" onclick="go(\'home\')">🏠 Bosh sahifa</button>';
  html += '</div>';

  /* Info grid */
  html += '<div class="result-grid">';

  /* LEFT: Levels */
  html += '<div class="result-col">';
  html += '  <h3>📊 Daraja bo\'yicha</h3>';
  html += '  <div class="level-rows">';
  LEVELS.forEach(function(l, i){
    html += '<div class="level-row' + (sc[i] >= 3 ? " pass" : "") + '">';
    html += '  <span>' + l + '</span>';
    html += '  <div class="bar"><i style="width:' + (sc[i] * 20) + '%"></i></div>';
    html += '  <span>' + sc[i] + '/5</span>';
    html += '</div>';
  });
  html += '  </div>';
  html += '  <p style="color:var(--text-2);font-size:14px;margin-top:16px;font-weight:600">';
  html += '    Jami: <b style="color:var(--primary)">' + total + '/30</b> (' + pct + '%) · ' + mins + ' daqiqa';
  html += '  </p>';
  html += '  <h3 style="margin-top:36px">🎯 Keyingi qadam — ' + (info.next || "eng yuqori daraja") + '</h3>';
  html += '  <ul style="padding-left:22px;color:var(--text-2);font-size:14px;line-height:2;margin-top:10px">';
  info.tips.forEach(function(t){
    html += '<li>' + esc(t) + '</li>';
  });
  html += '  </ul>';
  html += '</div>';

  /* RIGHT: Wrong answers */
  html += '<div class="result-col">';
  html += '  <h3>❌ Xatolar (' + wrong.length + ')</h3>';
  if(wrong.length){
    html += '  <div class="wrong-list">';
    wrong.forEach(function(w){
      html += '<div class="wrong-item">';
      html += '  <small>' + LEVELS[w.q.lv] + '</small>';
      html += '  <div style="margin-bottom:8px;font-weight:600">' + esc(w.q.t) + '</div>';
      html += '  <div>To\'g\'ri: <span class="correct">' + esc(w.q.o.filter(function(o){ return o.c; })[0].x) + '</span></div>';
      html += '</div>';
    });
    html += '  </div>';
  } else {
    html += '  <div class="wrong-item" style="border-left-color:var(--success)">🎉 Xato yo\'q! Ajoyib natija!</div>';
  }
  html += '</div>';

  html += '</div>';
  html += '</section>';

  app.innerHTML = html;

  if(pct >= 80) confetti(100);
  else if(pct >= 50) confetti(40);
}

window.retakeTest = function(){ startLevelTest(); };

window.copyResult = function(lv, total, pct){
  var text = "🎯 Mening ingliz tili darajam: " + lv + " (" + total + "/30, " + pct + "%) — pog'ona testi\n👉 t.me/Muhammad1y_20";
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast("✅ Nusxalandi", "success");
    }).catch(function(){ toast("Nusxalanmadi", "error"); });
  } else {
    /* Fallback */
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); toast("✅ Nusxalandi", "success"); }
    catch(e){ toast("Nusxalanmadi", "error"); }
    document.body.removeChild(ta);
  }
};

  html += '  <p style="color:var(--text-2);font-size:14px;margin-top:8px">Natija: <b style="color:var(--primary)">' + total + '/30 (' + pct + '%)</b></p>';

  html += '</div>';
  openModal(html);
  confetti(80);

/* ============ KEYBOARD SHORTCUTS ============ */
document.addEventListener("keydown", function(e){
  if(e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if(e.target.isContentEditable) return;

  if(S && !S.done && $(".quiz")){
    if(e.key >= "1" && e.key <= "4"){ quizPick(parseInt(e.key) - 1); e.preventDefault(); }
    else if(e.key === "Enter"){ window.quizNext(); e.preventDefault(); }
    else if(e.key === "ArrowLeft" && S.i > 0){ S.i--; renderQuiz(); }
    else if(e.key === "ArrowRight"){ window.quizNext(); }
  } else if(P && !P.done && $(".quiz")){
    if(e.key >= "1" && e.key <= "4"){ practiceAnswer(parseInt(e.key) - 1); e.preventDefault(); }
    else if(e.key === "Enter"){ 
      if(P.k === "listen") window.listenNext();
      else practiceNext();
      e.preventDefault();
    }
  }
});

/* ============ INIT ============ */
updateStreakDisplay();
home();

/* Expose for debugging */
window.__pogona = { store: store, achv: achv, go: go };

})();
