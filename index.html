const store={

 getWrong(){try{return JSON.parse(localStorage.getItem("pogona_wrong")||"[]")}catch(e){return[]}},

 getStreak(){try{const s=JSON.parse(localStorage.getItem("pogona_streak")||'{"days":0,"last":""}');return s}catch(e){return{days:0,last:""}}},
 updateStreak(){try{const s=store.getStreak();const today=new Date().toDateString();
  if(s.last===today)return s;
  const yesterday=new Date(Date.now()-86400000).toDateString();
  s.days = (s.last===yesterday) ? s.days+1 : 1;
  s.last = today;
  localStorage.setItem("pogona_streak",JSON.stringify(s));
  return s;
 }catch(e){return{days:0,last:""}}}
};

function pa(j){
 if(P.a!==null)return;
 P.a=j;
 const q=P.q[P.i];

 pr();
}

 else pe();
}

  <div class="card"><h3>Qat'iy qoida</h3><p>Darajani o'tish uchun 5 tadan kamida 3 tasiga to'g'ri javob berish kerak.</p></div>
  <div class="card"><h3>Xatolar tahlili</h3><p>Natijada qaysi savollarda adashganingiz va to'g'ri javoblar ko'rsatiladi. Xatolar statistikada saqlanadi.</p></div>
  <div class="card"><h3>Maxfiy</h3><p>Natijalar faqat sizning brauzeringizda saqlanadi. Serverga hech narsa yuborilmaydi.</p></div>
 </div>
 ${h.length?`<h2 class="sec">Oldingi natijalar</h2><div class="hist">${h.slice(0,6).map(x=>`<span><b>${esc(x.l)}</b> · ${x.p}% · ${esc(x.d)}</span>`).join("")}</div>`:""}`;
 $("#go").onclick=()=>go("level");
 app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>go(b.dataset.k));
}

/* ================== LEVEL TEST ================== */
function start(){
 /* Har darajadan 5 tadan tasodifiy tanlash */
 const q=[];
 for(let lv=0;lv<6;lv++){
  const bucket=RAW.filter((_,i)=>Math.floor(i/8)===lv);
  sh(bucket).slice(0,5).forEach(r=>q.push({lv,t:r[0],o:sh(r[1].map((x,k)=>({x,c:k===r[2])}))}));
 }
 S={i:0,a:[],t:Date.now(),q,startTime:Date.now()};
 quiz();window.scrollTo(0,0);
 startTimer();
}
function startTimer(){
 stopTimer();
 const start=Date.now();
 timerInterval=setInterval(()=>{
  const el=$("#tmr");if(!el)return;
  const sec=Math.floor((Date.now()-start)/1000);
  const m=String(Math.floor(sec/60)).padStart(2,"0");
  const s=String(sec%60).padStart(2,"0");
  el.textContent=`⏱ ${m}:${s}`;
  el.className="timer"+(sec>480?" danger":sec>300?" warn":"");
 },1000);
}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}
function quiz(){
 const q=S.q[S.i],n=S.q.length,sel=S.a[S.i];
 app.innerHTML=`<section class="quiz">
 <div class="bar"><i style="width:${S.i/n*100}%"></i></div>
 <div class="meta"><span>Savol ${S.i+1} / ${n}</span><span class="timer" id="tmr">⏱ 00:00</span><span>Javobni tanlang (1–4)</span></div>
 <h2 class="q">${esc(q.t)}</h2>
 <div class="opts">${q.o.map((o,k)=>`<button class="opt${sel===k?" sel":""}" data-k="${k}"><kbd>${k+1}</kbd>${esc(o.x)}</button>`).join("")}</div>
 <div class="nav">
  <button class="btn ghost" id="bk"${S.i?"":" disabled"}>← Orqaga</button>
  <button class="btn" id="nx"${sel===undefined?" disabled":""}>${S.i===n-1?"Natijani ko'rish →":"Keyingi →"}</button>
 </div></section>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
 $("#bk").onclick=()=>{if(S.i){S.i--;quiz()}};
 $("#nx").onclick=next;
}
function pick(k){S.a[S.i]=k;quiz()}
function next(){if(S.a[S.i]===undefined)return;if(S.i<S.q.length-1){S.i++;quiz()}else result()}

function result(){
 stopTimer();
 const sc=L.map((_,l)=>S.q.filter((q,i)=>q.lv===l&&q.o[S.a[i]]&&q.o[S.a[i]].c).length);
 let idx=-1;for(let l=0;l<6;l++){if(sc[l]>=3)idx=l;else break}
 const lv=idx<0?"Pre-A1":L[idx];
 const total=sc.reduce((a,b)=>a+b,0),pct=Math.round(total/30*100);
 const mins=Math.max(1,Math.round((Date.now()-S.t)/60000));
 store.add({l:lv,p:pct,d:new Date().toLocaleDateString("uz-UZ")});
 store.updateStreak();
 const wrong=S.q.map((q,i)=>({q,i})).filter(({q,i})=>!(q.o[S.a[i]]&&q.o[S.a[i]].c));
 wrong.forEach(({q,i})=>store.addWrong({t:q.t,correct:q.o.find(o=>o.c).x,chosen:(q.o[S.a[i]]||{x:"—"}).x}));
 const info=INFO[lv];
 app.innerHTML=`<section class="res">
 <p style="color:var(--muted)">Sizning darajangiz</p>
 <div class="big">${lv}</div>
 <h2 class="sec" style="margin-top:20px">${esc(info[0])}</h2>
 <p style="max-width:640px;color:var(--muted);font-size:18px">${esc(info[1])}</p>
 <div class="acts">
  <button class="btn" id="re">🔄 Qayta topshirish</button>
  <button class="btn ghost" id="cp">📋 Nusxalash</button>
  <button class="btn ghost" id="sh">🔗 Ulashish</button>
  <button class="btn ghost" id="hm">🏠 Bosh sahifa</button>
 </div>
 <div class="two">
  <div>
   <h2 class="sec" style="margin-top:10px">Daraja bo'yicha</h2>
   <div class="rows">${L.map((l,i)=>`<div class="row${sc[i]>=3?" pass":""}"><span>${l}</span><div class="bar"><i style="width:${sc[i]*20}%"></i></div><span>${sc[i]}/5</span></div>`).join("")}</div>
   <p style="color:var(--muted);font-size:14px">Jami: ${total}/30 (${pct}%) · ${mins} daqiqa</p>
  </div>
  <div>
      <h2 class="sec" style="margin-top:10px">Xatolar (${wrong.length})</h2>
   <div class="rev">${wrong.length?wrong.map(({q,i})=>`<div><small>${L[q.lv]}</small>${esc(q.t)}<br>To'g'ri javob: <b>${esc(q.o.find(o=>o.c).x)}</b></div>`).join(""):"<div style='border-left-color:var(--ok)'>🎉 Xato yo'q. Ajoyib natija!</div>"}</div>
  </div>
 </div></section>`;
 $("#re").onclick=start;
 $("#hm").onclick=home;
 $("#cp").onclick=async e=>{
  const t=`Mening ingliz tili darajam: ${lv} (${total}/30, ${pct}%) — pog'ona testi`;
  try{await navigator.clipboard.writeText(t);e.target.textContent="✅ Nusxalandi";setTimeout(()=>e.target.textContent="📋 Nusxalash",1500)}catch(x){toast("Nusxalab bo'lmadi")}
 };
 $("#sh").onclick=async e=>{
  const t=`Mening ingliz tili darajam: ${lv} (${total}/30, ${pct}%) — pog'ona testi`;
  if(navigator.share){try{await navigator.share({title:"Pog'ona natijam",text:t,url:location.href})}catch(x){}}
  else{try{await navigator.clipboard.writeText(t);toast("Havola nusxalandi")}catch(x){toast("Ulashib bo'lmadi")}}
 };
 window.scrollTo(0,0);
}

/* ================== KEYBOARD ================== */
addEventListener("keydown",e=>{
 if(e.target.matches("textarea,input"))return;
 if(S&&document.querySelector(".quiz")&&!S.done){
  if(e.key>="1"&&e.key<="4"){pick(+e.key-1);e.preventDefault()}
  else if(e.key==="Enter"){next();e.preventDefault()}
  else if(e.key==="ArrowLeft"&&S.i){S.i--;quiz()}
  else if(e.key==="ArrowRight")next();
 } else if(P&&!P.done&&document.querySelector(".quiz")){
  if(e.key>="1"&&e.key<="4"){pa(+e.key-1);e.preventDefault()}
  else if(e.key==="Enter")pn();
 }
});

/* ================== THEME ================== */
$("#theme").onclick=()=>{
 const r=document.documentElement;
 const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
 r.dataset.theme=dark?"light":"dark";
 localStorage.setItem("pogona_theme",r.dataset.theme);
};
try{const th=localStorage.getItem("pogona_theme");if(th)document.documentElement.dataset.theme=th}catch(e){}

/* ================== INIT ================== */
home();
})();
</script>
</body>
</html>
