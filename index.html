<style>
:root{--bg:#eef2f1;--panel:#fff;--text:#10201f;--muted:#566664;--line:rgba(16,32,31,.14);--acc:#2b4cff;--onacc:#fff;--hl:#ffe14d;--onhl:#10201f;--ok:#12805c;--bad:#c9304a;--warn:#f59e0b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1514;--panel:#16201f;--text:#e8efee;--muted:#93a5a2;--line:rgba(232,239,238,.16);--acc:#8fb0ff;--onacc:#0e1514;--ok:#4cd7a3;--bad:#ff7a90}}
:root[data-theme="dark"]{--bg:#0e1514;--panel:#16201f;--text:#e8efee;--muted:#93a5a2;--line:rgba(232,239,238,.16);--acc:#8fb0ff;--onacc:#0e1514;--ok:#4cd7a3;--bad:#ff7a90}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.55 Manrope,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Bricolage Grotesque",Manrope,sans-serif;letter-spacing:-.03em;line-height:1.02}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.wrap{width:min(1080px,calc(100% - 32px));margin:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0;flex-wrap:wrap;gap:10px}
.brand{font:800 22px "Bricolage Grotesque",sans-serif;letter-spacing:-.04em}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-size:14px}
.btn{display:inline-block;border:0;border-radius:12px;padding:15px 24px;background:var(--acc);color:var(--onacc);font-weight:700;font-size:17px;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:end;padding:36px 0 60px}
.hero h1{font-size:clamp(44px,7vw,88px);font-weight:800}
.hero p{color:var(--muted);max-width:520px;margin:20px 0 28px;font-size:18px}
.facts{display:flex;gap:22px;margin-top:26px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.facts b{color:var(--text);font-size:20px;display:block;font-family:"Bricolage Grotesque",sans-serif}
.stairs{display:flex;align-items:flex-end;gap:6px;height:340px}
.step{flex:1;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:var(--panel);padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.step b{font:800 26px "Bricolage Grotesque",sans-serif}
.step span{font-size:12px;color:var(--muted);line-height:1.25}
.step:last-child{background:var(--hl);color:var(--onhl);border-color:transparent}
.step:last-child span{color:var(--onhl)}
@keyframes rise{from{transform:translateY(60px);opacity:0}}
h2.sec{font-size:clamp(28px,4vw,44px);margin:40px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.card h3{font-size:24px;margin-bottom:6px}
.card p{color:var(--muted);font-size:14px}
.hist{display:flex;gap:10px;flex-wrap:wrap}
.hist span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.quiz{max-width:760px;margin:20px auto 60px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:10px 0 26px;gap:8px;flex-wrap:wrap}
.q{font:700 clamp(24px,4vw,36px)/1.2 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin-bottom:26px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:16px 18px;border:1.5px solid var(--line);background:var(--panel);border-radius:14px;font-size:18px;transition:transform .15s,border-color .15s}
.opt:hover{border-color:var(--acc);transform:translateX(4px)}
.opt kbd{font:700 13px Manrope;border:1px solid var(--line);border-radius:7px;padding:2px 8px;color:var(--muted)}
.opt.sel{background:var(--hl);color:var(--onhl);border-color:var(--hl)}
.opt.sel kbd{color:var(--onhl);border-color:var(--onhl)}
.opt.good{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.badc{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default;transform:none}
.nav{display:flex;justify-content:space-between;margin-top:26px;gap:8px;flex-wrap:wrap}
.res{padding:30px 0 60px}
.big{font:800 clamp(110px,22vw,230px)/.85 "Bricolage Grotesque",sans-serif;letter-spacing:-.07em;background:var(--hl);color:var(--onhl);display:inline-block;padding:10px 26px 20px;border-radius:20px}
.rows{display:grid;gap:10px;margin:14px 0}
.row{display:grid;grid-template-columns:44px 1fr 44px;gap:12px;align-items:center;font-weight:700}
.row .bar{height:14px}
.row.pass .bar i{background:var(--ok)}
.row span:last-child{color:var(--muted);text-align:right;font-weight:500}
.rev{display:grid;gap:8px}
.rev div{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:12px 16px;font-size:15px}
.rev small{color:var(--muted);display:block}
.rev b{color:var(--ok)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
footer{border-top:1px solid var(--line);padding:24px 0 36px;color:var(--muted);font-size:14px;margin-top:60px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{text-decoration:underline;color:inherit}
.menu{order:3;flex-basis:100%;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px}
.menu button.on{background:var(--hl);color:var(--onhl);border-color:transparent}
.passage{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:16px 18px;margin-bottom:20px;font-size:17px}
.expl{margin-top:16px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.fc{width:100%;min-height:260px;border:1.5px solid var(--line);border-radius:20px;background:var(--panel);font:800 clamp(36px,8vw,64px) "Bricolage Grotesque",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
.fc small{font:500 14px Manrope;color:var(--muted)}
.mode{text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--acc);transform:translateY(-3px)}
.mode small{display:block;margin-top:10px;color:var(--acc);font-weight:700}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stat div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat b{display:block;font:800 28px "Bricolage Grotesque",sans-serif;color:var(--acc)}
.stat span{font-size:13px;color:var(--muted)}
.timer{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.timer.warn{background:var(--warn);color:#fff}
.timer.danger{background:var(--bad);color:#fff;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.speak{background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:14px;color:var(--muted);margin-left:8px}
.speak:hover{border-color:var(--acc);color:var(--acc)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(100px);background:var(--text);color:var(--bg);padding:12px 22px;border-radius:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:transform .3s;z-index:100;pointer-events:none}
.toast.on{transform:translateX(-50%) translateY(0)}
@media(max-width:820px){.hero,.two{grid-template-columns:1fr}.stairs{height:260px}.opt{font-size:16px;padding:14px 16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function start(){
 var q=[];
 for(var lv=0;lv<6;lv++){
  var bucket=[];
  for(var i=lv*8;i<lv*8+8&&i<RAW.length;i++)bucket.push(RAW[i]);
  var picked=sh(bucket).slice(0,5);
  picked.forEach(function(r){q.push({lv:lv,t:r[0],o:sh(r[1].map(function(x,k){return{x:x,c:k===r[2]}}))})});
 }
 S={i:0,a:[],t:Date.now(),q:q};

}
function startTimer(){
 stopTimer();
 var start=Date.now();
 timerInterval=setInterval(function(){
  var el=$("#tmr");if(!el)return;
  var sec=Math.floor((Date.now()-start)/1000);
  var m=("0"+Math.floor(sec/60)).slice(-2);
  var s=("0"+(sec%60)).slice(-2);
  el.textContent="⏱ "+m+":"+s;
  el.className="timer"+(sec>480?" danger":sec>300?" warn":"");
 },1000);
}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}

 $("#bk").onclick=function(){if(S.i){S.i--;quiz()}};

}
function pick(k){S.a[S.i]=k;quiz()}
function next(){if(S.a[S.i]===undefined)return;if(S.i<S.q.length-1){S.i++;quiz()}else result()}

function result(){
 stopTimer();
 var sc=[0,0,0,0,0,0];
 S.q.forEach(function(q,i){if(q.o[S.a[i]]&&q.o[S.a[i]].c)sc[q.lv]++});
 var idx=-1;
 for(var l=0;l<6;l++){if(sc[l]>=3)idx=l;else break}
 var lv=idx<0?"Pre-A1":L[idx];
 var total=sc.reduce(function(a,b){return a+b},0),pct=Math.round(total/30*100);
 var mins=Math.max(1,Math.round((Date.now()-S.t)/60000));
 store.add({l:lv,p:pct,d:new Date().toLocaleDateString("uz-UZ")});
 store.updateStreak();
 var wrong=[];
 S.q.forEach(function(q,i){
  if(!(q.o[S.a[i]]&&q.o[S.a[i]].c)){
   wrong.push({q:q,i:i});
   var chosen=S.a[i]!==undefined?q.o[S.a[i]].x:"—";
   store.addWrong({t:q.t,correct:q.o.filter(function(o){return o.c})[0].x,chosen:chosen});
  }
 });
 var info=INFO[lv];
 var html='<section class="res">';
 html+='<p style="color:var(--muted)">Sizning darajangiz</p>';
 html+='<div class="big">'+lv+'</div>';

 html+='<div class="acts"><button class="btn" id="re">🔄 Qayta</button><button class="btn ghost" id="cp">📋 Nusxalash</button><button class="btn ghost" id="sh">🔗 Ulashish</button><button class="btn ghost" id="hm">🏠 Bosh sahifa</button></div>';
 html+='<div class="two"><div>';
 html+='<h2 class="sec" style="margin-top:10px">Daraja bo\'yicha</h2>';
 html+='<div class="rows">';
