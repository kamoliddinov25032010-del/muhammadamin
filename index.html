<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#06162b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pog'ona — Ingliz tilini A1 dan C2 gacha o'rganing</title>
<meta name="description" content="Daraja testi, grammatika, lug'at, tinglash, o'qish va yozish. Bepul, o'zbek tilida, reyting bilan.">
<meta property="og:title" content="Pog'ona — Ingliz tili darajangizni bilib oling">
<meta property="og:description" content="30 savollik daraja testi, A1–C2. Bepul va o'zbek tilida.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e1a;--bg-2:#0f1422;--panel:rgba(255,255,255,.05);--panel-2:rgba(255,255,255,.08);
  --text:#f1f5f9;--text-2:#94a3b8;--muted:#64748b;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.15);
  --primary:#8b5cf6;--primary-2:#6366f1;
  --accent:#f59e0b;--success:#10b981;--danger:#ef4444;--gold:#fbbf24;--silver:#94a3b8;--bronze:#d97706;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#6366f1 50%,#3b82f6 100%);
  --grad-2:linear-gradient(135deg,#f59e0b 0%,#ef4444 100%);
  --grad-3:linear-gradient(135deg,#10b981 0%,#06b6d4 100%);
  --grad-4:linear-gradient(135deg,#ec4899 0%,#8b5cf6 100%);
  --radius:16px;--radius-lg:22px;
  --shadow:0 8px 32px rgba(0,0,0,.4);--shadow-lg:0 20px 60px rgba(0,0,0,.5);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#f8fafc;--bg-2:#ffffff;--panel:#ffffff;--panel-2:#f1f5f9;
  --text:#0f172a;--text-2:#475569;--muted:#94a3b8;
  --line:rgba(15,23,42,.08);--line-2:rgba(15,23,42,.15);
  --shadow:0 8px 32px rgba(15,23,42,.1);
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  min-height:100vh;background:var(--bg);color:var(--text);
  font:16px/1.6 'Manrope',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:var(--safe-bottom);
}
body::before{
  content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;z-index:-1;
  background:
    radial-gradient(circle at 20% 20%,rgba(139,92,246,.15),transparent 50%),
    radial-gradient(circle at 80% 60%,rgba(59,130,246,.12),transparent 50%);
  animation:floatBg 25s ease-in-out infinite;
}
@keyframes floatBg{0%,100%{transform:translate(0,0)}50%{transform:translate(-3%,3%)}}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Manrope',sans-serif;letter-spacing:-.03em;line-height:1.1;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:8px}
::selection{background:var(--primary);color:#fff}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px}

/* ============ HEADER ============ */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(10,14,26,.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--line);
  padding-top:var(--safe-top);
}
:root[data-theme="light"] .header{background:rgba(248,250,252,.85)}
.header-inner{
  max-width:1280px;margin:0 auto;padding:12px 16px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.brand{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.04em;cursor:pointer}
.brand-mark{
  width:36px;height:36px;border-radius:10px;background:var(--grad);color:#fff;
  display:grid;place-items:center;font:800 18px 'Bricolage Grotesque',sans-serif;
  box-shadow:0 6px 20px rgba(139,92,246,.4);
}
.header-actions{display:flex;gap:6px;align-items:center}
.icon-btn{
  padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:5px;transition:all .2s;
  min-height:40px;
}
.icon-btn:hover{border-color:var(--primary)}
.user-chip{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px 6px 6px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);
  font-weight:700;font-size:13px;cursor:pointer;
}
.user-avatar{
  width:26px;height:26px;border-radius:50%;
  background:var(--grad);color:#fff;
  display:grid;place-items:center;
  font-size:13px;font-weight:800;
}

/* ============ NAV ============ */
.nav-wrap{max-width:1280px;margin:0 auto;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.nav-wrap::-webkit-scrollbar{display:none}
.nav{display:flex;gap:6px;padding-bottom:2px}
.nav button{
  white-space:nowrap;padding:8px 14px;border-radius:999px;
  font-weight:700;font-size:13px;color:var(--text-2);
  border:1px solid transparent;transition:all .2s;
  display:inline-flex;align-items:center;gap:5px;
}
.nav button.on{background:var(--grad);color:#fff;box-shadow:0 4px 16px rgba(139,92,246,.3)}

/* ============ MAIN ============ */
.main{max-width:1280px;margin:0 auto;padding:24px 16px 80px;min-height:60vh}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:14px;font-weight:700;font-size:15px;
  transition:all .2s;white-space:nowrap;
  background:var(--panel);border:1px solid var(--line-2);
  min-height:48px;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.primary{background:var(--grad);color:#fff;border:0;box-shadow:0 8px 24px rgba(139,92,246,.4)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-2)}
.btn.good{background:var(--grad-3);color:#fff;border:0}
.btn.danger{background:var(--grad-2);color:#fff;border:0}
.btn.sm{padding:8px 14px;font-size:13px;min-height:38px}
.btn.lg{padding:16px 28px;font-size:17px;min-height:56px}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}

/* ============ LOGIN ============ */
.login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px 16px;
}
.login-card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:28px;padding:32px 24px;
  max-width:420px;width:100%;
  backdrop-filter:blur(30px);box-shadow:var(--shadow-lg);
  position:relative;overflow:hidden;
}
.login-card::before{
  content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;
  background:radial-gradient(circle,rgba(139,92,246,.15),transparent 60%);
  pointer-events:none;
}
.login-card > *{position:relative;z-index:1}
.login-logo{
  width:64px;height:64px;border-radius:20px;
  background:var(--grad);color:#fff;margin:0 auto 20px;
  display:grid;place-items:center;font:800 32px 'Bricolage Grotesque',sans-serif;
  box-shadow:0 12px 32px rgba(139,92,246,.4);
}
.login-card h1{font-size:28px;text-align:center;margin-bottom:8px}
.login-card .subtitle{text-align:center;color:var(--text-2);font-size:15px;margin-bottom:28px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em}
.form-input{
  width:100%;padding:14px 18px;border-radius:14px;
  background:var(--bg-2);border:1.5px solid var(--line-2);
  color:var(--text);font:16px 'Manrope',sans-serif;
  transition:all .2s;min-height:52px;
}
.form-input:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px rgba(139,92,246,.15)}
.form-input::placeholder{color:var(--muted)}
.avatar-picker{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.avatar-opt{
  aspect-ratio:1;border-radius:14px;
  background:var(--panel-2);border:2px solid var(--line);
  font-size:24px;display:grid;place-items:center;
  transition:all .2s;cursor:pointer;
}
.avatar-opt:hover{transform:scale(1.1)}
.avatar-opt.sel{border-color:var(--primary);background:var(--grad);box-shadow:0 0 20px rgba(139,92,246,.4)}

/* ============ HERO ============ */
.hero{
  display:grid;grid-template-columns:1.1fr .9fr;gap:40px;
  align-items:center;padding:20px 0 48px;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);
  font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:20px;
}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero h1{font-size:clamp(36px,7vw,72px);line-height:1.05;letter-spacing:-.04em;margin-bottom:20px}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--text-2);max-width:520px;font-size:16px;margin-bottom:28px;line-height:1.6}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px}
.hero-stat{
  background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:14px 12px;text-align:center;
  transition:all .2s;
}
.hero-stat:hover{transform:translateY(-3px);border-color:var(--primary)}
.hero-stat b{display:block;font:800 22px 'Bricolage Grotesque',sans-serif;margin-bottom:2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-stat span{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.05em}

/* ============ STAIRS ============ */
.stairs{
  display:flex;align-items:flex-end;gap:6px;height:340px;
  padding:18px;border-radius:24px;
  background:var(--panel);border:1px solid var(--line);
  position:relative;overflow:hidden;
}
.step{
  flex:1;border-radius:12px 12px 4px 4px;padding:12px 8px;
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;color:#fff;cursor:pointer;transition:all .3s;
  animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
}
.step:nth-child(1){background:linear-gradient(135deg,#10b981,#06b6d4)}
.step:nth-child(2){background:linear-gradient(135deg,#06b6d4,#3b82f6)}
.step:nth-child(3){background:linear-gradient(135deg,#3b82f6,#6366f1)}
.step:nth-child(4){background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.step:nth-child(5){background:linear-gradient(135deg,#8b5cf6,#d946ef)}
.step:nth-child(6){background:linear-gradient(135deg,#d946ef,#ec4899)}
.step:hover{transform:translateY(-6px)}
.step b{font:800 22px 'Bricolage Grotesque',sans-serif;margin-bottom:2px}
.step span{font-size:10px;opacity:.9;line-height:1.2;font-weight:600}
@keyframes rise{from{transform:translateY(80px);opacity:0}}

/* ============ SECTION ============ */
.section{margin-top:56px}
.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.section-head h2{font-size:clamp(24px,4vw,38px);letter-spacing:-.03em}
.section-head p{color:var(--text-2);font-size:14px;max-width:520px}

/* ============ CARDS ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:20px;
  transition:all .3s;position:relative;overflow:hidden;
}
.card.hoverable{cursor:pointer}
.card.hoverable:hover{transform:translateY(-4px);border-color:var(--primary);box-shadow:0 16px 40px rgba(139,92,246,.2)}
.card-icon{
  width:52px;height:52px;border-radius:16px;
  display:grid;place-items:center;font-size:26px;
  margin-bottom:14px;background:var(--panel-2);
}
.card-icon.grad-1{background:var(--grad);color:#fff}
.card-icon.grad-2{background:var(--grad-2);color:#fff}
.card-icon.grad-3{background:var(--grad-3);color:#fff}
.card-icon.grad-4{background:var(--grad-4);color:#fff}
.card h3{font-size:19px;margin-bottom:6px}
.card p{color:var(--text-2);font-size:13px;line-height:1.5;margin-bottom:12px}
.card .tag{
  display:inline-block;padding:4px 10px;border-radius:999px;
  background:var(--panel-2);border:1px solid var(--line);
  font-size:11px;font-weight:700;color:var(--text-2);
}

/* ============ LEADERBOARD ============ */
.leaderboard{display:grid;gap:10px}
.lb-row{
  display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;
  padding:14px 18px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;transition:all .2s;
}
.lb-row:hover{transform:translateX(4px);border-color:var(--primary)}
.lb-row.me{background:linear-gradient(180deg,rgba(139,92,246,.15),var(--panel));border-color:var(--primary);box-shadow:0 8px 24px rgba(139,92,246,.2)}
.lb-rank{
  width:40px;height:40px;border-radius:12px;
  display:grid;place-items:center;
  font:800 16px 'Bricolage Grotesque',sans-serif;
  background:var(--panel-2);border:1px solid var(--line);
}
.lb-rank.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;border:0;box-shadow:0 6px 20px rgba(251,191,36,.4)}
.lb-rank.silver{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff;border:0}
.lb-rank.bronze{background:linear-gradient(135deg,#d97706,#92400e);color:#fff;border:0}
.lb-user{display:flex;align-items:center;gap:10px;min-width:0}
.lb-avatar{
  width:36px;height:36px;border-radius:50%;
  background:var(--grad);color:#fff;
  display:grid;place-items:center;font-size:18px;flex-shrink:0;
}
.lb-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-name small{display:block;color:var(--text-2);font-size:12px;font-weight:500}
.lb-score{text-align:right}
.lb-score b{display:block;font:800 18px 'Bricolage Grotesque',sans-serif;color:var(--primary)}
.lb-score span{font-size:11px;color:var(--muted);font-weight:600}

/* ============ PROFILE ============ */
.profile-head{
  display:flex;align-items:center;gap:20px;
  padding:24px;background:var(--panel);border:1px solid var(--line);
  border-radius:24px;margin-bottom:24px;flex-wrap:wrap;
}
.profile-avatar{
  width:80px;height:80px;border-radius:24px;
  background:var(--grad);color:#fff;
  display:grid;place-items:center;font-size:40px;
  box-shadow:0 12px 32px rgba(139,92,246,.4);flex-shrink:0;
}
.profile-info{flex:1;min-width:0}
.profile-info h2{font-size:24px;margin-bottom:4px}
.profile-info p{color:var(--text-2);font-size:14px}

/* ============ QUIZ ============ */
.quiz{max-width:820px;margin:0 auto}
.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.quiz-title{font-weight:700;font-size:14px;color:var(--text-2)}
.quiz-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);
  font-size:12px;font-weight:700;
}
.chip.good{background:rgba(16,185,129,.15);color:var(--success);border-color:rgba(16,185,129,.3)}
.chip.timer{font-variant-numeric:tabular-nums}
.chip.warn{background:rgba(245,158,11,.15);color:var(--accent)}
.chip.danger{background:rgba(239,68,68,.15);color:var(--danger);animation:pulse 1s infinite}
.progress{height:8px;background:var(--panel);border-radius:999px;overflow:hidden;margin-bottom:24px;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--grad);transition:width .5s ease}
.passage{
  background:var(--panel);border:1px solid var(--line);
  border-left:4px solid var(--primary);
  border-radius:14px;padding:18px 20px;margin-bottom:20px;
  font-size:16px;line-height:1.7;
}
.passage b{display:block;margin-bottom:8px;font-size:12px;color:var(--primary);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.q-text{font:700 clamp(20px,3.5vw,30px)/1.3 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;margin-bottom:24px}
.opts{display:grid;gap:10px}
.opt{
  display:flex;gap:14px;align-items:center;
  text-align:left;width:100%;padding:16px 18px;
  border:1.5px solid var(--line-2);
  background:var(--panel);border-radius:14px;
  font-size:16px;font-weight:600;
  transition:all .2s;min-height:60px;
}
.opt:hover:not(:disabled){border-color:var(--primary);transform:translateX(4px)}
.opt kbd{
  font:700 13px 'Manrope',sans-serif;
  min-width:28px;height:28px;padding:0 8px;
  display:grid;place-items:center;
  border:1px solid var(--line-2);border-radius:8px;
  color:var(--text-2);flex-shrink:0;
}
.opt.sel{background:var(--grad);color:#fff;border-color:transparent}
.opt.sel kbd{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.opt.good{background:var(--grad-3);color:#fff;border-color:transparent}
.opt.good kbd{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.opt.badc{background:var(--grad-2);color:#fff;border-color:transparent}
.opt.badc kbd{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.opt:disabled{cursor:default;transform:none}
.expl{
  margin-top:20px;padding:16px 20px;
  background:var(--panel);border:1px solid var(--line);
  border-left:4px solid var(--primary);
  border-radius:14px;font-size:14px;line-height:1.6;
  animation:slideDown .35s cubic-bezier(.2,.8,.2,1);
}
.expl b{color:var(--primary)}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px)}}
.quiz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}

/* ============ RESULT ============ */
.result{padding:20px 0}
.result-hero{text-align:center;padding:32px 0}
.result-level{
  font:800 clamp(80px,18vw,160px)/.9 'Bricolage Grotesque',sans-serif;
  letter-spacing:-.06em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;display:inline-block;
  animation:zoomIn .8s cubic-bezier(.2,.8,.2,1);
}
@keyframes zoomIn{from{transform:scale(.3) rotate(-10deg);opacity:0}}
.result-title{font-size:clamp(22px,4vw,32px);margin-top:16px}
.result-desc{color:var(--text-2);max-width:600px;margin:12px auto 0;font-size:15px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:36px}
.result-col h3{font-size:20px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.level-rows{display:grid;gap:8px}
.level-row{
  display:grid;grid-template-columns:44px 1fr 52px;gap:10px;align-items:center;
  padding:10px 14px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;font-weight:700;font-size:14px;
}
.level-row.pass{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08)}
.level-row .bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.level-row .bar i{display:block;height:100%;background:var(--grad);transition:width .8s}
.level-row.pass .bar i{background:var(--grad-3)}
.level-row span:last-child{text-align:right;color:var(--text-2);font-size:12px}
.wrong-list{display:grid;gap:8px}
.wrong-item{
  background:var(--panel);border:1px solid var(--line);
  border-left:4px solid var(--danger);
  border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.6;
}
.wrong-item small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.wrong-item .correct{color:var(--success);font-weight:700}

/* ============ STATS ============ */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat-box{
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:18px 14px;text-align:center;
}
.stat-box b{display:block;font:800 28px 'Bricolage Grotesque',sans-serif;margin-bottom:4px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-box span{font-size:11px;color:var(--text-2);font-weight:700;letter-spacing:.05em}
.hist{display:flex;gap:8px;flex-wrap:wrap}
.hist-item{
  background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;
  display:inline-flex;gap:6px;align-items:center;
}
.hist-item b{color:var(--primary);font-weight:800}

/* ============ ACHIEVEMENTS ============ */
.achievements{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.achv{
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:16px;text-align:center;
  transition:all .3s;position:relative;
}
.achv.locked{opacity:.35;filter:grayscale(1)}
.achv.unlocked{
  border-color:transparent;
  background:linear-gradient(180deg,rgba(139,92,246,.15),var(--panel));
}
.achv.unlocked::after{
  content:'✓';position:absolute;top:8px;right:8px;
  width:22px;height:22px;border-radius:50%;
  background:var(--grad-3);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:800;
}
.achv-emoji{font-size:36px;margin-bottom:8px;display:block;line-height:1}
.achv b{display:block;font-size:14px;margin-bottom:4px}
.achv small{color:var(--text-2);font-size:11px;line-height:1.4;display:block}

/* ============ FLASHCARD ============ */
.flashcard{
  width:100%;min-height:300px;
  border:1px solid var(--line-2);border-radius:24px;
  background:var(--panel);padding:24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;cursor:pointer;transition:all .3s;
  font:800 clamp(28px,6vw,52px)/1.15 'Bricolage Grotesque',sans-serif;
  letter-spacing:-.03em;
}
.flashcard:hover{border-color:var(--primary);transform:translateY(-3px)}
.flashcard small{font:500 13px 'Manrope',sans-serif;color:var(--text-2);letter-spacing:0}

/* ============ TIPS ============ */
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tip{
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:18px;display:flex;gap:12px;align-items:start;
}
.tip-icon{font-size:28px;line-height:1;flex-shrink:0}
.tip h4{font-size:15px;margin-bottom:4px}
.tip p{font-size:13px;color:var(--text-2);line-height:1.55}

/* ============ FOOTER (davomi) ============ */
.footer p{color:var(--muted);font-size:12px}
.footer-links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.footer-links a{
  font-size:13px;font-weight:700;color:var(--text-2);
  transition:all .2s;padding:6px 10px;border-radius:10px;
  display:inline-flex;align-items:center;gap:5px;
}
.footer-links a:hover{color:var(--primary);background:var(--panel)}
.footer-copy{text-align:right;color:var(--muted);font-size:11px}

/* ============ TOAST ============ */
.toast{
  position:fixed;bottom:calc(24px + var(--safe-bottom));left:50%;
  transform:translate(-50%,150%);
  background:var(--text);color:var(--bg);
  padding:14px 22px;border-radius:14px;
  font-weight:700;font-size:14px;
  box-shadow:var(--shadow-lg);
  transition:transform .4s cubic-bezier(.2,.8,.2,1);
  z-index:1000;pointer-events:none;
  max-width:calc(100vw - 32px);text-align:center;
}
.toast.on{transform:translate(-50%,0)}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--danger);color:#fff}

/* ============ MODAL ============ */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:none;align-items:center;justify-content:center;
  z-index:500;padding:16px;
}
.modal.on{display:flex;animation:fadeIn .3s}
.modal-inner{
  background:var(--bg-2);border:1px solid var(--line);
  border-radius:24px;padding:32px 24px;
  max-width:480px;width:100%;
  box-shadow:var(--shadow-lg);
  animation:modalIn .4s cubic-bezier(.2,.8,.2,1);
  text-align:center;position:relative;overflow:hidden;
  max-height:90vh;overflow-y:auto;
}
@keyframes fadeIn{from{opacity:0}}
@keyframes modalIn{from{opacity:0;transform:scale(.9) translateY(30px)}}
.modal-emoji{font-size:64px;margin-bottom:16px;display:block;animation:bounce .8s}
@keyframes bounce{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}

/* ============ CONFETTI ============ */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:1000;overflow:hidden}
.confetti i{position:absolute;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ============ CERTIFICATE ============ */
.certificate{
  background:var(--panel);border:2px solid var(--primary);
  border-radius:20px;padding:28px 20px;text-align:center;
  position:relative;overflow:hidden;
}
.certificate h2{font-size:22px;margin-bottom:6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.certificate .cert-level{font:800 72px 'Bricolage Grotesque',sans-serif;letter-spacing:-.05em;margin:12px 0;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.certificate .cert-name{font-size:16px;font-weight:700;margin:16px 0 8px;border-bottom:2px dashed var(--line-2);padding-bottom:6px;display:inline-block;min-width:200px}
.certificate .cert-date{color:var(--text-2);font-size:12px;margin-top:12px}

/* ============ CALENDAR ============ */
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px}
.cal-day{
  aspect-ratio:1;border-radius:8px;
  background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center;font-size:11px;font-weight:700;
  color:var(--text-2);transition:all .2s;
}
.cal-day.active{background:var(--grad);color:#fff;border-color:transparent}
.cal-day.today{outline:2px solid var(--accent);outline-offset:2px}

/* ============ MOBILE FIRST ============ */
@media(max-width:900px){
  .hero{grid-template-columns:1fr;gap:28px;padding:12px 0 32px}
  .stairs{height:240px}
  .hero-stats{grid-template-columns:repeat(2,1fr)}
  .result-grid{grid-template-columns:1fr}
  .footer-inner{grid-template-columns:1fr;text-align:center;gap:16px}
  .footer-copy{text-align:center}
}
@media(max-width:600px){
  .main{padding:18px 14px 60px}
  .header-inner{padding:10px 14px}
  .nav-wrap{padding:0 14px 8px}
  .brand{font-size:18px}
  .brand-mark{width:32px;height:32px;font-size:16px}
  .hero h1{font-size:32px}
  .opt{padding:14px 16px;font-size:15px;min-height:56px}
  .q-text{font-size:19px}
  .btn{padding:11px 18px;font-size:14px;min-height:44px}
  .btn.lg{padding:14px 22px;font-size:15px;min-height:50px}
  .card{padding:16px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .achv{padding:14px 10px}
  .achv-emoji{font-size:30px}
  .lb-row{padding:12px 14px;gap:10px}
  .lb-avatar{width:32px;height:32px;font-size:15px}
  .lb-rank{width:34px;height:34px;font-size:14px}
  .profile-head{padding:18px;gap:14px}
  .profile-avatar{width:64px;height:64px;font-size:32px}
  .profile-info h2{font-size:20px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ============ HELPERS ============ */
function $(s){ return document.querySelector(s); }
function $$(s){ return document.querySelectorAll(s); }
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function shuffle(a){
  a = a.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function localISO(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function todayISO(){ return localISO(new Date()); }
function today(){ return new Date().toDateString(); }
function uid(){ return "u_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ============ USERS DATABASE ============ */
var Users = {
  KEY: "pogona_users",
  CURRENT: "pogona_current_user",
  all: function(){
    try{
      var raw = localStorage.getItem(this.KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  },
  save: function(list){
    try{ localStorage.setItem(this.KEY, JSON.stringify(list)); }catch(e){}
  },
  find: function(id){
    var all = this.all();
    for(var i = 0; i < all.length; i++){
      if(all[i].id === id) return all[i];
    }
    return null;
  },
  findByEmail: function(email){
    var all = this.all();
    email = (email || "").toLowerCase().trim();
    for(var i = 0; i < all.length; i++){
      if(all[i].email === email) return all[i];
    }
    return null;
  },
  create: function(name, email, avatar){
    var user = {
      id: uid(),
      name: name.trim(),
      email: (email || "").toLowerCase().trim(),
      avatar: avatar || "🦊",
      createdAt: Date.now(),
      stats: {
        xp: 0, tests: 0, best: 0, totalCorrect: 0, totalAnswers: 0,
        streak: { days:0, last:"", best:0, calendar:[] },
        achievements: [],
        cards: {},
        writing: {},
        visited: [],
        history: [],
        wrong: [],
        dailyBonus: ""
      }
    };
    var all = this.all();
    all.push(user);
    this.save(all);
    return user;
  },
  update: function(user){ setTimeout(pushStats,0);
    var all = this.all();
    for(var i = 0; i < all.length; i++){
      if(all[i].id === user.id){
        all[i] = user;
        this.save(all);
        return;
      }
    }
    all.push(user);
    this.save(all);
  },
  setCurrent: function(id){
    try{ localStorage.setItem(this.CURRENT, id); }catch(e){}
  },
  getCurrentId: function(){
    try{ return localStorage.getItem(this.CURRENT); }catch(e){ return null; }
  },
  logout: function(){
    try{ localStorage.removeItem(this.CURRENT); }catch(e){}
  },
  ranking: function(){ if(GLOBAL&&GLOBAL.length){ var g=GLOBAL.slice(); if(CURRENT_USER&&!g.some(function(u){return u.id===CURRENT_USER.id})) g.push(CURRENT_USER); return g.sort(function(a,b){return (b.stats.xp||0)-(a.stats.xp||0)}); }
    var all = this.all();
    return all.slice().sort(function(a, b){
      return (b.stats.xp || 0) - (a.stats.xp || 0);
    });
  }
};

/* ============ STORE (joriy foydalanuvchi uchun) ============ */
var store = {
  get: function(){
    if(!CURRENT_USER) return null;
    var fresh = Users.find(CURRENT_USER.id);
    if(fresh) CURRENT_USER = fresh;
    return CURRENT_USER.stats;
  },
  save: function(){
    if(!CURRENT_USER) return;
    Users.update(CURRENT_USER);
  },
  add: function(r){
    var d = this.get();
    if(!d) return;
    d.history.unshift(r);
    d.history = d.history.slice(0, 50);
    d.tests = (d.tests || 0) + 1;
    /* XP: har to'g'ri javob = 10 XP */
    this.save();
  },
  addXP: function(amount){
    var d = this.get();
    if(!d) return;
    d.xp = (d.xp || 0) + amount;
    this.save();
    return d.xp;
  },
  addWrong: function(item){
    var d = this.get();
    if(!d) return;
    var exists = d.wrong.some(function(w){ return w.t === item.t; });
    if(!exists){
      d.wrong.unshift({ t:item.t, correct:item.correct, chosen:item.chosen, date: todayISO() });
      d.wrong = d.wrong.slice(0, 100);
      this.save();
    }
  },
  clearWrong: function(){
    var d = this.get();
    if(!d) return;
    d.wrong = [];
    this.save();
  },
  updateStreak: function(){
    var d = this.get();
    if(!d) return null;
    var t = today();
    if(d.streak.last === t) return d.streak;
    var y = new Date(Date.now() - 86400000).toDateString();
    d.streak.days = (d.streak.last === y) ? d.streak.days + 1 : 1;
    d.streak.last = t;
    if(d.streak.days > d.streak.best) d.streak.best = d.streak.days;
    var iso = todayISO();
    if(d.streak.calendar.indexOf(iso) === -1) d.streak.calendar.push(iso);
    if(d.streak.calendar.length > 60) d.streak.calendar = d.streak.calendar.slice(-60);
    this.save();
    return d.streak;
  },
  saveCard: function(word){
    var d = this.get();
    if(!d) return;
    d.cards[word] = (d.cards[word] || 0) + 1;
    this.save();
  },
  saveWriting: function(title, text){
    var d = this.get();
    if(!d) return;
    d.writing[title] = text;
    this.save();
  },
  addVisited: function(m){
    var d = this.get();
    if(!d) return;
    if(d.visited.indexOf(m) === -1){
      d.visited.push(m);
      this.save();
    }
  },
  canClaimBonus: function(){
    var d = this.get();
    if(!d) return false;
    return d.dailyBonus !== todayISO();
  },
  claimBonus: function(){
    var d = this.get();
    if(!d) return;
    d.dailyBonus = todayISO();
    this.save();
  }
};

/* ============ ACHIEVEMENTS ============ */
var achv = {
  unlock: function(id){
    var d = store.get();
    if(!d) return false;
    if(d.achievements.indexOf(id) !== -1) return false;
    d.achievements.push(id);
    store.save();
    var a = ACHIEVEMENTS.filter(function(x){ return x.id === id; })[0];
    if(a){
      setTimeout(function(){
        openModal(
          '<span class="modal-emoji">' + a.emoji + '</span>' +
          '<h2 style="font-size:24px;margin-bottom:8px">🎉 Yangi yutuq!</h2>' +
          '<p style="background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;font-size:18px;margin-bottom:8px">' + esc(a.title) + '</p>' +
          '<p style="color:var(--text-2);margin-bottom:24px;font-size:14px">' + esc(a.desc) + '</p>' +
          '<button class="btn primary" onclick="window.closeModal()">Davom etish →</button>'
        );
        confetti(40);
      }, 400);
    }
    return true;
  },
  check: function(){
    var d = store.get();
    if(!d) return;
    var self = this;
    if(d.history.length >= 1) self.unlock("first");
    if(d.streak.days >= 3) self.unlock("streak3");
    if(d.streak.days >= 7) self.unlock("streak7");
    if(d.streak.days >= 30) self.unlock("streak30");
    if(d.history.some(function(h){ return h.p === 100; })) self.unlock("perfect");
    if(d.history.some(function(h){ return ["B1","B2","C1","C2"].indexOf(h.l) > -1; })) self.unlock("b1");
    if(d.history.some(function(h){ return ["B2","C1","C2"].indexOf(h.l) > -1; })) self.unlock("b2");
    if(d.history.some(function(h){ return ["C1","C2"].indexOf(h.l) > -1; })) self.unlock("c1");
    if(d.history.some(function(h){ return h.l === "C2"; })) self.unlock("c2");
    if(d.visited.indexOf("grammar") !== -1) self.unlock("grammar");
    if(d.visited.indexOf("read") !== -1) self.unlock("reader");
    if(d.visited.indexOf("listen") !== -1) self.unlock("listener");
    if(d.visited.indexOf("write") !== -1) self.unlock("writer");
    if(d.visited.indexOf("phrase") !== -1) self.unlock("speaker");
    var known = Object.keys(d.cards).filter(function(k){ return d.cards[k] > 0; }).length;
    if(known >= 50) self.unlock("vocab50");
    if(known >= 80) self.unlock("vocab100");
    var needed = ["level","grammar","vocab","read","listen","phrase","kids","biz","write","cards"];
    if(needed.every(function(m){ return d.visited.indexOf(m) !== -1; })) self.unlock("allround");
    var perfects = d.history.filter(function(h){ return h.p === 100; }).length;
    if(perfects >= 5) self.unlock("master");
    if(d.achievements.length >= ACHIEVEMENTS.length - 1) self.unlock("legend");
  }
};

   PRACTICE ENGINE
   ============================================================ */
function getPracticeData(k){
  if(k === "grammar") return { t:"Grammatika", q: shuffle(GRAMMAR).slice(0, 10) };
  if(k === "vocab"){
    var picked = shuffle(VOCAB).slice(0, 10);
    return {
      t: "Lug'at",
      q: picked.map(function(p){
        var w = p[0], correct = p[1];
        var vp=function(x){return /moq$/.test(x)};var pool=VOCAB.filter(function(x){return x[0]!==w&&vp(x[1])===vp(correct)});if(pool.length<3)pool=VOCAB.filter(function(x){return x[0]!==w});var others=shuffle(pool.map(function(x){return x[1];})).slice(0,3);
        return ['"' + w + '" nima degani?', [correct].concat(others), 0];
      })
    };
  }
  if(k === "kids") return { t:"Bolalar", q: shuffle(KIDS).slice(0, 10) };
  if(k === "biz") return { t:"Biznes", q: shuffle(BUSINESS).slice(0, 10) };
  if(k === "phrase") return { t:"Frazal fe'llar", q: shuffle(PHRASAL).slice(0, 10) };
  return null;
}

function startPractice(k){
  if(k === "read"){ startReading(); return; }
  var d = getPracticeData(k);
  if(!d){ home(); return; }
  P = {
    k: k, i: 0, s: 0, a: null, done: false,
    d: { t: d.t },
    q: d.q.map(function(r){
      return {
        t: r[0], e: r[3],
        o: shuffle(r[1].map(function(x, j){ return { x:x, c: j === r[2] }; }))
      };
    })
  };
  renderPractice();
}

function startReading(){
  var r = READINGS[Math.floor(Math.random() * READINGS.length)];
  P = {
    k: "read", i: 0, s: 0, a: null, done: false,
    d: { t: "O'qish", p: r.text, title: r.title },
    q: r.q.map(function(x){
      return { t: x[0], o: shuffle(x[1].map(function(v, j){ return { x:v, c: j === x[2] }; })) };
    })
  };
  renderPractice();
}

function renderPractice(){
  var d = P.d, q = P.q[P.i], n = P.q.length, a = P.a;
  var html = '<section class="quiz">';
  html += '<div class="quiz-head">';
  html += '  <span class="quiz-title">' + esc(d.t) + '</span>';
  html += '  <div class="quiz-meta">';
  html += '    <span class="chip">' + (P.i + 1) + '/' + n + '</span>';
  html += '    <span class="chip good">✓ ' + P.s + '</span>';
  html += '  </div>';
  html += '</div>';
  html += '<div class="progress"><i style="width:' + (P.i / n * 100) + '%"></i></div>';

  if(d.p){
    html += '<p class="passage"><b>' + esc(d.title || "") + '</b>';
    html += esc(d.p);
    html += ' <button class="icon-btn" style="padding:4px 10px;font-size:14px;min-height:32px" onclick="window.speakCur()">🔊</button>';
    html += '</p>';
  }

  html += '<h2 class="q-text">' + esc(q.t) + '</h2>';
  html += '<div class="opts">';
  q.o.forEach(function(o, j){
    var cls = "opt";
    if(a !== null){
      if(o.c) cls += " good";
      else if(j === a) cls += " badc";
    }
    html += '<button class="' + cls + '" data-k="' + j + '"' + (a !== null ? " disabled" : "") + '>';
    html += '<kbd>' + (j + 1) + '</kbd>' + esc(o.x);
    html += '</button>';
  });
  html += '</div>';

  if(a !== null){
    var ok = q.o[a].c;
    html += '<p class="expl"><b>' + (ok ? "✅ To'g'ri!" : "❌ Noto'g'ri.") + '</b> ';
    html += esc(q.e || (ok ? "Barakalla!" : "To'g'ri javob: " + q.o.filter(function(o){ return o.c; })[0].x));
    html += '</p>';
    html += '<div class="quiz-nav"><span></span>';
    html += '<button class="btn primary" onclick="window.practiceNext()">' + (P.i === n - 1 ? "Yakunlash →" : "Keyingi →") + '</button>';
    html += '</div>';
  }

  html += '</section>';
  document.getElementById("app").innerHTML = html;

  $$(".opt").forEach(function(b){
    b.onclick = function(){ practiceAnswer(parseInt(b.dataset.k)); };
  });
}

function practiceAnswer(j){
  if(P.a !== null) return;
  P.a = j;
  var q = P.q[P.i];
  if(q.o[j].c){
    P.s++;
    store.addXP(10);
  } else {
    store.addWrong({ t:q.t, correct:q.o.filter(function(o){ return o.c; })[0].x, chosen:q.o[j].x });
  }
  renderPractice();
}

function practiceNext(){
  if(P.a === null) return;
  if(P.i < P.q.length - 1){
    P.i++; P.a = null; renderPractice();
  } else {
    finishPractice();
  }
}

function finishPractice(){
  if(P.done) return;
  P.done = true;
  var n = P.q.length, p = Math.round(P.s / n * 100);
  store.add({ l: P.d.t, p: p, date: new Date().toLocaleDateString("uz-UZ"), mode: P.k });
  store.updateStreak();
  updateStreakDisplay();
  achv.check();

  var msg = p >= 80 ? "🎉 Ajoyib natija!" : p >= 50 ? "👍 Yaxshi, davom eting!" : "💪 Yana urinib ko'ring.";
  var xpEarned = P.s * 10;
  var html = '<section class="result">';
  html += '<div class="result-hero">';
  html += '  <p style="color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px">' + esc(P.d.t) + '</p>';
  html += '  <div class="result-level">' + P.s + '/' + n + '</div>';
  html += '  <h2 class="result-title">' + msg + '</h2>';
  html += '  <p class="result-desc">Natija: ' + p + '% · +' + xpEarned + ' XP</p>';
  html += '</div>';
  html += '<div class="quiz-nav" style="justify-content:center">';
  html += '  <button class="btn primary" onclick="window.practiceAgain()">🔄 Qayta</button>';
  html += '  <button class="btn" onclick="go(\'home\')">🏠 Bosh sahifa</button>';
  html += '  <button class="btn" onclick="go(\'rate\')">🏆 Reyting</button>';
  html += '</div>';
  html += '</section>';
  document.getElementById("app").innerHTML = html;

  if(p >= 80) confetti(60);
  else if(p >= 50) confetti(20);
}

  /* ============================================================

   ============================================================ */
function startLevelTest(){
  var q = [];
  for(var lv = 0; lv < 6; lv++){
    var bucket = [];
    for(var i = lv * 10; i < lv * 10 + 10 && i < RAW.length; i++){
      bucket.push(RAW[i]);
    }
    var picked = shuffle(bucket).slice(0, 5);
    picked.forEach(function(r){
      q.push({
        lv: lv,
        t: r[0],
        o: shuffle(r[1].map(function(x, k){ return { x:x, c: k === r[2] }; }))
      });
    });
  }
  S = { i: 0, a: [], t: Date.now(), q: q, done: false };
  renderQuiz();
  startTimer();
}

function startTimer(){
  stopTimer();
  var start = Date.now();
  timerInterval = setInterval(function(){
    var el = $("#tmr");
    if(!el) return;
    var sec = Math.floor((Date.now() - start) / 1000);
    var m = ("0" + Math.floor(sec / 60)).slice(-2);
    var s = ("0" + (sec % 60)).slice(-2);
    el.textContent = "⏱ " + m + ":" + s;
    el.className = "chip timer" + (sec > 480 ? " danger" : sec > 300 ? " warn" : "");
  }, 1000);
}

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}

function renderQuiz(){
  var q = S.q[S.i], n = S.q.length, sel = S.a[S.i];
  var html = '<section class="quiz">';
  html += '<div class="quiz-head">';
  html += '  <span class="quiz-title">🎯 Daraja testi</span>';
  html += '  <div class="quiz-meta">';
  html += '    <span class="chip">' + (S.i + 1) + '/' + n + '</span>';
  html += '    <span class="chip timer" id="tmr">⏱ 00:00</span>';
  html += '  </div>';
  html += '</div>';
  html += '<div class="progress"><i style="width:' + (S.i / n * 100) + '%"></i></div>';
  html += '<h2 class="q-text">' + esc(q.t) + '</h2>';
  html += '<div class="opts">';
  q.o.forEach(function(o, k){
    html += '<button class="opt' + (sel === k ? " sel" : "") + '" data-k="' + k + '">';
    html += '<kbd>' + (k + 1) + '</kbd>' + esc(o.x);
    html += '</button>';

  html += '  <button class="btn primary" onclick="window.quizNext()"' + (sel === undefined ? " disabled" : "") + '>';
  html += (S.i === n - 1 ? "Natijani ko'rish →" : "Keyingi →");
  html += '  </button>';
  html += '</div>';
  html += '</section>';
  document.getElementById("app").innerHTML = html;

  $$(".opt").forEach(function(b){
    b.onclick = function(){ quizPick(parseInt(b.dataset.k)); };
  });
}

function quizPick(k){
  S.a[S.i] = k;

window.quizBack = function(){

window.quizNext = function(){

/* ============================================================

   ============================================================ */
function renderResult(){
  if(S.done) return;
  stopTimer();
  S.done = true;

  var sc = [0,0,0,0,0,0];
  S.q.forEach(function(q, i){
    if(q.o[S.a[i]] && q.o[S.a[i]].c) sc[q.lv]++;
  });

  var idx = -1;
  for(var l = 0; l < 6; l++){
    if(sc[l] >= 3) idx = l;
    else break;
  }

  var lv = idx < 0 ? "Pre-A1" : LEVELS[idx];
  var total = sc.reduce(function(a,b){ return a+b; }, 0);
  var pct = Math.round(total / 30 * 100);
  var mins = Math.max(1, Math.round((Date.now() - S.t) / 60000));

  /* XP bonus: to'g'ri javoblar * 10 + daraja bonus */
  var xpBonus = total * 10;
  if(idx >= 0) xpBonus += (idx + 1) * 20;

  store.add({ l: lv, p: pct, date: new Date().toLocaleDateString("uz-UZ"), mode: "level" });
  store.addXP(xpBonus);
  store.updateStreak();
  updateStreakDisplay();

  var wrong = [];
  S.q.forEach(function(q, i){
    if(!(q.o[S.a[i]] && q.o[S.a[i]].c)){
      wrong.push({ q: q, i: i });
      var chosen = S.a[i] !== undefined ? q.o[S.a[i]].x : "—";
      store.addWrong({
        t: q.t,
        correct: q.o.filter(function(o){ return o.c; })[0].x,
        chosen: chosen
      });
    }
  });

  achv.check();

  var info = LEVEL_INFO[lv];

  var html = '<section class="result">';
  html += '<div class="result-hero">';

  html += '  <p style="color:var(--primary);font-weight:800;font-size:16px;margin-top:16px">+' + xpBonus + ' XP</p>';
  html += '</div>';

  /* Actions */
  html += '<div class="quiz-nav" style="justify-content:center;margin-bottom:32px">';
  html += '  <button class="btn primary" onclick="window.retakeTest()">🔄 Qayta</button>';
  html += '  <button class="btn" onclick="window.showCert(\'' + lv + '\',' + total + ',' + pct + ')">🎓 Sertifikat</button>';
  html += '  <button class="btn" onclick="window.copyResult(\'' + lv + '\',' + total + ',' + pct + ')">📋 Nusxalash</button>';
  html += '  <button class="btn" onclick="window.shareResult(\'' + lv + '\',' + total + ',' + pct + ')">📤 Ulashish</button>';
  html += '  <button class="btn" onclick="go(\'home\')">🏠 Asosiy</button>';
  html += '</div>';

  /* Info grid */
  html += '<div class="result-grid">';

  /* LEFT: Levels */
  html += '<div class="result-col">';
  html += '  <h3>📊 Daraja bo\'yicha</h3>';
  html += '  <div class="level-rows">';
  LEVELS.forEach(function(l, i){
    html += '<div class="level-row' + (sc[i] >= 3 ? " pass" : "") + '">';
    html += '  <span>' + l + '</span>';
    html += '  <div class="bar"><i style="width:' + (sc[i] * 20) + '%"></i></div>';
    html += '  <span>' + sc[i] + '/5</span>';
    html += '</div>';
  });
  html += '  </div>';
  html += '  <p style="color:var(--text-2);font-size:13px;margin-top:14px;font-weight:600">';
  html += '    Jami: <b style="color:var(--primary)">' + total + '/30</b> (' + pct + '%) · ' + mins + ' daqiqa';
  html += '  </p>';
  html += '  <h3 style="margin-top:32px">🎯 Keyingi qadam — ' + (info.next || "eng yuqori") + '</h3>';
  html += '  <ul style="padding-left:20px;color:var(--text-2);font-size:13px;line-height:1.9;margin-top:10px">';
  info.tips.forEach(function(t){
    html += '<li>' + esc(t) + '</li>';
  });
  html += '  </ul>';
  html += '</div>';

  /* RIGHT: Wrong answers */
  html += '<div class="result-col">';
  html += '  <h3>❌ Xatolar (' + wrong.length + ')</h3>';
  if(wrong.length){
    html += '  <div class="wrong-list">';
    wrong.forEach(function(w){
      html += '<div class="wrong-item">';
      html += '  <small>' + LEVELS[w.q.lv] + '</small>';
      html += '  <div style="margin-bottom:6px;font-weight:600">' + esc(w.q.t) + '</div>';
      html += '  <div style="font-size:13px">To\'g\'ri: <span class="correct">' + esc(w.q.o.filter(function(o){ return o.c; })[0].x) + '</span></div>';
      html += '</div>';
    });
    html += '  </div>';
  } else {
    html += '  <div class="wrong-item" style="border-left-color:var(--success)">🎉 Xato yo\'q! Ajoyib natija!</div>';
  }
  html += '</div>';

  html += '</div>';
  html += '</section>';

  document.getElementById("app").innerHTML = html;

  if(pct >= 80) confetti(100);
  else if(pct >= 50) confetti(40);
}

document.addEventListener("keydown", function(e){
  if(e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if(e.target.isContentEditable) return;

  if(S && !S.done && $(".quiz")){
    if(e.key >= "1" && e.key <= "4"){ quizPick(parseInt(e.key) - 1); e.preventDefault(); }
    else if(e.key === "Enter"){ window.quizNext(); e.preventDefault(); }
    else if(e.key === "ArrowLeft" && S.i > 0){ S.i--; renderQuiz(); }
    else if(e.key === "ArrowRight"){ window.quizNext(); }
  } else if(P && !P.done && $(".quiz")){
    if(e.key >= "1" && e.key <= "4"){ practiceAnswer(parseInt(e.key) - 1); e.preventDefault(); }
    else if(e.key === "Enter"){
      if(P.k === "listen") window.listenNext();
      else practiceNext();
      e.preventDefault();
    }
  }
});

  syncT=setTimeout(function(){
    var u=CURRENT_USER&&Users.find(CURRENT_USER.id),t=u&&tokOf(u.id);
    if(!t)return;
    api("/sync",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+t},body:JSON.stringify({id:u.id,xp:u.stats.xp||0,tests:u.stats.tests||0,streak:(u.stats.streak||{}).days||0,avatar:u.avatar})}).catch(function(){});
  },1500);
}
function refreshBoard(cb){
  api("/leaderboard").then(function(r){
    GLOBAL=r.users.map(function(x){return{id:x.id,name:x.name,avatar:x.avatar,stats:{xp:x.xp,tests:x.tests,streak:{days:x.streak}}}});
    if(cb)cb();
  }).catch(function(){GLOBAL=null});
}
